<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反事实通用查看器 · What-if Viewer</title>
<style>
  :root{
    --ink:#2A2521; --ink-soft:#5b5249; --parch:#efe7d6; --parch2:#f6f1e4;
    --line:#c9bfa8; --accent:#7a5a2e;
    --ok:#3f7d54; --warn:#c8a24a; --bad:#b5443a; --info:#7fa7c4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink);background:var(--parch2);}
  .app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:#332d27;color:#f3ecdc;border-bottom:2px solid #110f0d;}
  header h1{font-size:16px;margin:0;font-weight:700;}
  header .scene{font-size:12px;color:#d9cdb6;border:1px solid #6a5f50;padding:2px 8px;border-radius:10px;}
  header .spacer{flex:1;}
  .banner{background:#b5443a;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.5px;}
  .body{display:flex;flex:1;min-height:0;}
  aside{width:360px;flex:0 0 360px;background:var(--parch);border-right:1px solid var(--line);overflow-y:auto;padding:14px;}
  main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto;padding:16px;}
  section.block{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:var(--parch2);overflow:hidden;}
  section.block > h2{margin:0;font-size:13px;padding:7px 11px;background:#e3d8bf;border-bottom:1px solid var(--line);font-weight:700;}
  section.block .c{padding:10px 11px;font-size:12.5px;line-height:1.5;}
  .yr-row{display:flex;align-items:center;gap:10px;}
  .yr-row input[type=range]{flex:1;}
  .yr-val{font-weight:700;font-size:15px;min-width:46px;text-align:right;}
  .mode-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0;}
  .mode-toggle button{background:transparent;color:var(--ink);border:0;padding:5px 12px;cursor:pointer;font-size:12.5px;font-family:inherit;}
  .mode-toggle button.active{background:var(--accent);color:#fff;font-weight:700;}
  .stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);}
  .stat .num{font-weight:700;}
  .bar{height:9px;background:#ddd2b8;border-radius:5px;overflow:hidden;margin:4px 0 8px;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--ok));}
  .ev{font-size:12px;line-height:1.5;margin:5px 0;padding-left:8px;border-left:3px solid var(--line);}
  .ev.bad{border-color:var(--bad);} .ev.warn{border-color:var(--warn);} .ev.info{border-color:var(--info);}
  .ev .sev{font-size:10px;padding:1px 5px;border-radius:8px;margin-right:5px;color:#fff;}
  .ev.bad .sev{background:var(--bad);} .ev.warn .sev{background:var(--warn);} .ev.info .sev{background:var(--info);}
  .chart-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;}
  svg.chart{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px;align-items:center;}
  .legend .it{display:flex;align-items:center;gap:5px;}
  .legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);}
  .legend .ln{width:18px;height:0;border-top:3px solid var(--ink);display:inline-block;}
  .legend .ln.dash{border-top-style:dashed;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .err{margin:20px;padding:15px;background:#fbe9e7;border:1px solid var(--bad);border-radius:8px;color:#7a241c;white-space:pre-wrap;font-family:monospace;}
  .dim-table{border-collapse:collapse;width:100%;font-size:11.5px;margin-top:8px;}
  .dim-table th,.dim-table td{border:1px solid var(--line);padding:3px 5px;text-align:center;}
  .dim-table th{background:#e3d8bf;}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="banner">[what-if]</span>
    <h1>反事实通用查看器</h1>
    <span class="scene" id="sceneHint">载入中…</span>
    <span class="spacer"></span>
    <span class="hint" style="color:#d9cdb6">诚实边界：反事实产物与史实分离呈现，不混同</span>
  </header>
  <div class="body">
    <aside>
      <section class="block">
        <h2>年份 / Year</h2>
        <div class="c">
          <div class="yr-row"><input type="range" id="year" min="0" max="1" step="1" value="0"><span class="yr-val" id="yrVal">—</span></div>
          <div class="mode-toggle" id="modeToggle">
            <button data-mode="real">史实</button>
            <button data-mode="branch" class="active">反事实</button>
            <button data-mode="diff">差异</button>
          </div>
          <div class="hint">史实=基准分支；反事实=所选分支；差异=反事实−史实（六维偏离）。</div>
        </div>
      </section>
      <section class="block">
        <h2>分支 / Branch</h2>
        <div class="c" id="branchBox"></div>
      </section>
      <section class="block">
        <h2>六维状态 / Six Dimensions</h2>
        <div class="c" id="dimNow"></div>
      </section>
      <section class="block">
        <h2>吻合度 / 偏离</h2>
        <div class="c" id="stats"></div>
      </section>
      <section class="block">
        <h2>分支事件叙述 / Branch Events</h2>
        <div class="c" id="be"></div>
      </section>
    </aside>
    <main>
      <div id="geoNote" class="hint"></div>
      <div class="chart-wrap" id="chartWrap"></div>
      <div id="heatWrap"></div>
      <div class="legend" id="legend"></div>
    </main>
  </div>
</div>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var PAR = new URLSearchParams(location.search);
  var SCENE = PAR.get('scene') || 'song_wanganshi';
  var BRANCH = PAR.get('branch') || 'persist';
  var SEV_LABEL = { info:'趋势', warn:'风险', bad:'危局' };

  function fail(e){ var m=document.createElement('div'); m.className='err'; m.textContent='加载失败：\n'+(e&&e.stack?e.stack:e); document.querySelector('.body').prepend(m); console.error(e); }
  function getJSON(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status+' '+u); return r.json(); }); }

  try { init(); } catch(e){ fail(e); }

  function init(){
    var base = '../data/' + SCENE + '/';
    Promise.all([
      getJSON(base + 'sim_config.json').catch(function(){ return null; }),
      getJSON(base + 'branch_events_' + BRANCH + '.json').catch(function(){ return null; }),
      getJSON(base + 'state_hist_' + BRANCH + '.json').catch(function(){ return null; }),
      getJSON(base + 'places.json').catch(function(){ return null; })
    ]).then(function(res){
      var cfg = res[0], be = res[1], histBranch = res[2], places = res[3];
      if(!cfg){ throw new Error('缺少 sim_config.json（场景 '+SCENE+' 非反事实场景或尚未生成）'); }
      var realBranch = cfg.real_branch || 'repeal';
      var realFile = (realBranch === BRANCH) ? null : base + 'state_hist_' + realBranch + '.json';
      return getJSON(realFile || base + 'state_hist_' + BRANCH + '.json').then(function(histReal){
        return { cfg:cfg, be:be, histBranch:histBranch, histReal:histReal, places:places, realBranch:realBranch };
      });
    }).then(function(D){ render(D); }).catch(fail);
  }

  var STATE = { mode:'branch', year:0 };

  function render(D){
    var cfg = D.cfg, be = D.be || {events:[]}, hb = D.histBranch || [], hr = D.histReal || [];
    var yrs = (hb.length ? hb : hr).map(function(s){ return s.year; });
    var y0 = yrs[0], y1 = yrs[yrs.length-1];
    var dimTargets = cfg.dim_targets || ['制度','经济','思想','社会','技术'];
    var scenarioType = cfg.scenario_type || 'reform';
    $('sceneHint').textContent = SCENE + ' · ' + scenarioType + ' · ' + (y0||'?') + '–' + (y1||'?');

    var bb = $('branchBox'); bb.innerHTML='';
    (cfg.branches||[]).forEach(function(b){
      var x=document.createElement('button'); x.className='btn'; x.style.cssText='margin:3px;';
      x.textContent=b.label||b.id; x.dataset.id=b.id;
      if(b.id===BRANCH){ x.style.background='var(--accent)'; x.style.color='#fff'; }
      x.onclick=function(){ location.search='?scene='+SCENE+'&branch='+b.id; };
      bb.appendChild(x);
    });
    if(!bb.children.length) bb.innerHTML='<span class="hint">无分支配置</span>';

    var ys=$('year'); ys.min=y0; ys.max=y1; ys.value=y0; STATE.year=y0;
    ys.oninput=function(){ STATE.year=+ys.value; updateYear(D); };
    $('modeToggle').querySelectorAll('button').forEach(function(btn){
      btn.onclick=function(){ STATE.mode=btn.dataset.mode;
        $('modeToggle').querySelectorAll('button').forEach(function(x){ x.classList.toggle('active', x===btn); });
        drawChart(D); updateYear(D); };
    });

    drawChart(D);
    renderHeat(D);
    renderEvents(be);
    updateYear(D);
    buildLegend(dimTargets);
    $('geoNote').textContent = (scenarioType==='military')
      ? '军事场景：地图由 sim_map.html 呈现；本页聚焦六维+时间轴的通用反事实视图。'
      : '非军事场景：无领土易手，主视图为六维状态轨迹（真实 vs 反事实）。';
  }

  function yearIndex(D, y){
    var hb=D.histBranch||[]; for(var i=0;i<hb.length;i++) if(hb[i].year===y) return i; return -1;
  }

  function drawChart(D){
    var hb=D.histBranch||[], hr=D.histReal||[];
    var dimTargets = D.cfg.dim_targets || ['制度','经济','思想','社会','技术'];
    if(!hb.length){ $('chartWrap').innerHTML='<div class="hint">无六维时序数据。</div>'; return; }
    var W=720, H=320, padL=40, padR=16, padT=16, padB=34;
    var yrs=hb.map(function(s){return s.year;});
    var y0=yrs[0], y1=yrs[yrs.length-1];
    function px(y){ return padL + (y1>y0? (y-y0)/(y1-y0):0)*(W-padL-padR); }
    function py(v){ return padT + (1-v)*(H-padT-padB); }
    function val(s,dim){ return (s.dims&&s.dims[dim]!=null)?s.dims[dim]:(s.reform_index||0); }
    var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
    for(var g=0; g<=1.0001; g+=0.25){
      var gy=py(g);
      svg+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="#e3d8bf" stroke-width="1"/>';
      svg+='<text x="'+(padL-6)+'" y="'+(gy+3)+'" font-size="10" fill="#5b5249" text-anchor="end">'+g.toFixed(2)+'</text>';
    }
    yrs.forEach(function(y){
      if((y-y0)%Math.ceil((y1-y0+1)/8)===0 || y===y1){
        svg+='<text x="'+px(y)+'" y="'+(H-padB+14)+'" font-size="10" fill="#5b5249" text-anchor="middle">'+y+'</text>';
      }
    });
    var palette=['#7a5a2e','#3f7d54','#b5443a','#7fa7c4','#9a6db0','#c8a24a'];
    dimTargets.forEach(function(dim, di){
      var col=palette[di%palette.length];
      if(hr.length){
        var pts=hr.map(function(s){ return px(s.year)+','+py(val(s,dim)); }).join(' ');
        svg+='<polyline points="'+pts+'" fill="none" stroke="#9a9286" stroke-width="1.4" stroke-dasharray="4 3"/>';
      }
      var ptsB=hb.map(function(s){ return px(s.year)+','+py(val(s,dim)); }).join(' ');
      svg+='<polyline points="'+ptsB+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
      svg+='<text x="'+(W-padR-2)+'" y="'+(py(val(hb[hb.length-1],dim))+4)+'" font-size="10" fill="'+col+'" text-anchor="end">'+dim+'</text>';
    });
    svg+='<line x1="'+px(STATE.year)+'" y1="'+padT+'" x2="'+px(STATE.year)+'" y2="'+(H-padB)+'" stroke="#b5443a" stroke-width="1" stroke-dasharray="2 2"/>';
    svg+='</svg>';
    $('chartWrap').innerHTML=svg;
  }

  function renderHeat(D){
    var hb=D.histBranch||[], hr=D.histReal||[];
    var dimTargets = D.cfg.dim_targets || ['制度','经济','思想','社会','技术'];
    if(!hb.length){ $('heatWrap').innerHTML=''; return; }
    var idx={}; hr.forEach(function(s){ idx[s.year]=s; });
    function val(s,dim){ return (s.dims&&s.dims[dim]!=null)?s.dims[dim]:(s.reform_index||0); }
    var tbl='<table class="dim-table"><tr><th>年</th>';
    dimTargets.forEach(function(d){ tbl+='<th>'+d+'</th>'; });
    tbl+='</tr>';
    hb.forEach(function(s){
      tbl+='<tr><td>'+s.year+'</td>';
      dimTargets.forEach(function(d){
        var v=val(s,d);
        if(STATE.mode==='diff' && idx[s.year]){
          var dlt=v-val(idx[s.year],d);
          tbl+='<td style="background:'+(dlt>=0?'rgba(63,125,84,.18)':'rgba(181,68,58,.18)')+'">'+(dlt>=0?'+':'')+dlt.toFixed(2)+'</td>';
        } else {
          var bg='rgba(122,90,46,'+(0.15+0.8*v)+')';
          tbl+='<td style="background:'+bg+';color:#fff">'+v.toFixed(2)+'</td>';
        }
      });
      tbl+='</tr>';
    });
    tbl+='</table>';
    var head = STATE.mode==='real'?'史实':STATE.mode==='branch'?'反事实':'差异';
    $('heatWrap').innerHTML='<section class="block"><h2>六维明细（'+head+'）</h2><div class="c">'+
      (STATE.mode==='diff'?'<div class="hint">差异模式：绿=反事实高于史实，红=低于。</div>':'')+tbl+'</div></section>';
  }

  function renderEvents(be){
    var el=$('be'); var evs=(be&&be.events)||[];
    if(!evs.length){ el.innerHTML='<div class="hint">本分支无偏离事件。</div>'; return; }
    var byYear={}; evs.forEach(function(e){ (byYear[e.year]=byYear[e.year]||[]).push(e); });
    var html='';
    Object.keys(byYear).sort(function(a,b){return +a-+b;}).forEach(function(y){
      byYear[y].forEach(function(e){
        var sev=e.severity||'info';
        html+='<div class="ev '+sev+'"><span class="sev">'+SEV_LABEL[sev]+'</span><b>'+y+'</b> '+(e.description||'')+'</div>';
      });
    });
    el.innerHTML=html;
  }

  function updateYear(D){
    $('yrVal').textContent=STATE.year;
    var hb=D.histBranch||[], hr=D.histReal||[];
    var i=yearIndex(D, STATE.year);
    var s = i>=0? hb[i] : null;
    var sr=null; hr.forEach(function(x){ if(x.year===STATE.year) sr=x; });
    var dimTargets = D.cfg.dim_targets || ['制度','经济','思想','社会','技术'];
    function val(o,dim){ return (o&&o.dims&&o.dims[dim]!=null)?o.dims[dim]:(o?o.reform_index:0); }
    var box=$('dimNow');
    if(!s){ box.innerHTML='<div class="hint">'+STATE.year+' 无数据</div>'; }
    else {
      var html='<div style="margin-bottom:6px">改革指数 <b>'+(s.reform_index!=null?s.reform_index.toFixed(2):'—')+'</b> · 教育垄断 <b>'+(s.education_monopoly!=null?s.education_monopoly.toFixed(2):'—')+'</b></div>';
      dimTargets.forEach(function(d){
        var v=val(s,d), rv=sr?val(sr,d):0;
        html+='<div class="stat"><span>'+d+'</span><span class="num">'+v.toFixed(2)+
          (sr?' <span style="color:var(--ink-soft);font-weight:400">('+( (v-rv)>=0?'+':'')+(v-rv).toFixed(2)+' vs 史实)</span>':'')+'</span></div>';
      });
      box.innerHTML=html;
    }
    if(sr){
      var div=0,n=0;
      dimTargets.forEach(function(d){ div+=Math.abs(val(s,d)-val(sr,d)); n++; });
      var avg=div/(n||1);
      $('stats').innerHTML=
        '<div class="stat"><span>当前年（'+STATE.year+'）六维平均偏离</span><span class="num">'+avg.toFixed(3)+'</span></div>'+
        '<div class="bar"><i style="width:'+Math.min(100,avg*100)+'%"></i></div>'+
        '<div class="stat"><span>反事实分支</span><span class="num">'+BRANCH+'</span></div>'+
        '<div class="stat"><span>史实基准</span><span class="num">'+(D.realBranch||'repeal')+'</span></div>'+
        '<div class="hint">平均偏离=各目标维度 |反事实−史实| 的均值，范围 0–1。</div>';
    }
    drawChart(D); renderHeat(D);
  }

  function buildLegend(dimTargets){
    var box=$('legend');
    box.innerHTML =
      '<span class="it"><span class="ln dash"></span>史实基准</span>'+
      '<span class="it"><span class="ln"></span>反事实</span>'+
      '<span class="it"><span class="sw" style="background:var(--info)"></span>趋势</span>'+
      '<span class="it"><span class="sw" style="background:var(--warn)"></span>风险</span>'+
      '<span class="it"><span class="sw" style="background:var(--bad)"></span>危局</span>'+
      '<span class="it" style="margin-left:auto;color:var(--ink-soft)">Branch Event 符合 v0.57 schema · 诚实边界 [what-if]</span>';
  }
})();
</script>
</body>
</html>
