<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辽东明清 · 沙盘 + 模拟器合体（SIM_MAPCORE + ControlLayer + SimLayer）</title>
<style>
  :root{
    --ink:#2A2521; --ink-soft:#5b5249; --parch:#efe7d6; --parch2:#f6f1e4;
    --line:#c9bfa8; --accent:#7a5a2e; --bad:#b5443a; --ok:#3f7d54;
    --ming:rgb(197,90,70); --qing:rgb(67,122,91); --cont:rgb(128,122,112);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink);background:var(--parch2);}
  .app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#332d27;color:#f3ecdc;border-bottom:2px solid #110f0d;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;}
  header .scene{font-size:12px;color:#d9cdb6;border:1px solid #6a5f50;padding:2px 8px;border-radius:10px;}
  header .spacer{flex:1;}
  .mode-toggle{display:flex;gap:0;border:1px solid #6a5f50;border-radius:8px;overflow:hidden;}
  .mode-toggle button{background:transparent;color:#d9cdb6;border:0;padding:6px 13px;cursor:pointer;font-size:13px;font-family:inherit;}
  .mode-toggle button.active{background:#c8a24a;color:#221c14;font-weight:700;}
  .body{display:flex;flex:1;min-height:0;}
  aside{width:330px;flex:0 0 330px;background:var(--parch);border-right:1px solid var(--line);overflow-y:auto;padding:14px;}
  main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;}
  .map-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#EFECE2;cursor:grab;}
  .map-wrap.grabbing{cursor:grabbing;}
  .map-wrap canvas,.map-wrap svg{position:absolute;inset:0;width:100%;height:100%;}
  #ctrlCv{pointer-events:none;}
  #map{pointer-events:none;}
  .map-tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5;}
  .map-tools button{width:34px;height:34px;border:1px solid var(--line);background:var(--parch2);border-radius:8px;cursor:pointer;font-size:16px;color:var(--ink);font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .map-tools button:hover{background:#e6dcc4;}
  .zoom-badge{position:absolute;right:12px;top:12px;background:rgba(51,45,39,.82);color:#f3ecdc;padding:3px 9px;border-radius:10px;font-size:12px;z-index:5;}
  .scale-bar{position:absolute;left:12px;bottom:12px;background:rgba(246,241,228,.86);padding:4px 8px;border-radius:6px;font-size:11px;color:var(--ink);z-index:5;display:flex;align-items:center;gap:6px;}
  .elev-legend{position:absolute;right:12px;bottom:12px;width:130px;height:12px;border:1px solid var(--line);border-radius:3px;z-index:5;}
  .elev-legend::after{content:"海拔";position:absolute;left:0;top:-15px;font-size:10px;color:var(--ink-soft);}
  .legend{display:flex;gap:14px;padding:8px 14px;background:var(--parch2);border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap;align-items:center;}
  .legend .it{display:flex;align-items:center;gap:5px;}
  .legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);}
  section.block{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:var(--parch2);overflow:hidden;}
  section.block > h2{margin:0;font-size:13px;padding:7px 11px;background:#e3d8bf;border-bottom:1px solid var(--line);font-weight:700;}
  section.block .c{padding:9px 11px;font-size:12.5px;line-height:1.5;}
  .yr-row{display:flex;align-items:center;gap:10px;}
  .yr-row input[type=range]{flex:1;}
  .yr-val{font-weight:700;font-size:15px;min-width:42px;text-align:right;}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .btn{border:1px solid var(--line);background:#e3d8bf;color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;}
  .btn:hover{background:#d8caa8;}
  .btn.primary{background:#c8a24a;border-color:#9c7a2e;color:#221c14;font-weight:700;}
  .param{margin:7px 0;}
  .param label{display:flex;justify-content:space-between;font-size:12px;}
  .param label .v{color:var(--accent);font-weight:700;}
  .param input[type=range]{width:100%;}
  .branches{display:flex;flex-wrap:wrap;gap:6px;}
  .branches button{border:1px solid var(--line);background:#e9dfc8;color:var(--ink);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;}
  .branches button.active{background:#7a5a2e;color:#fff;border-color:#5a3f1e;font-weight:700;}
  .stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);}
  .stat .num{font-weight:700;}
  .bar{height:9px;background:#ddd2b8;border-radius:5px;overflow:hidden;margin:4px 0 8px;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#b5443a,#c8a24a,#3f7d54);}
  .divl{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto;}
  .divl li{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;border-bottom:1px dotted var(--line);}
  .chip{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.2);}
  .arrow{color:var(--ink-soft);}
  .ev{font-size:12px;line-height:1.5;margin:5px 0;padding-left:8px;border-left:3px solid var(--line);}
  .ev.bad{border-color:var(--bad);} .ev.warn{border-color:#c8a24a;} .ev.info{border-color:#7fa7c4;}
  .ev .sev{font-size:10px;padding:1px 5px;border-radius:8px;margin-right:5px;color:#fff;}
  .ev.bad .sev{background:var(--bad);} .ev.warn .sev{background:#c8a24a;} .ev.info .sev{background:#7fa7c4;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .map-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(51,45,39,.78);color:#f3ecdc;padding:4px 12px;border-radius:12px;font-size:12px;z-index:5;white-space:nowrap;}
  .err{margin:20px;padding:15px;background:#fbe9e7;border:1px solid var(--bad);border-radius:8px;color:#7a241c;font-family:monospace;white-space:pre-wrap;}
  /* v0.68 视角切换 */
  .vp-sel{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--parch2);font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .vp-card{margin-top:8px;font-size:12px;line-height:1.5;}
  .vp-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
  .vp-name{font-weight:700;font-size:13.5px;}
  .vp-badge{font-size:10px;padding:1px 6px;border-radius:8px;color:#fff;}
  .vp-badge.me{background:var(--accent);}
  .vp-badge.foe{background:var(--bad);}
  .vp-badge.ally{background:#3f7d54;}
  .vp-badge.third{background:#6b5f50;}
  .vp-row{display:flex;gap:6px;margin:3px 0;}
  .vp-k{flex:0 0 52px;color:var(--ink-soft);}
  .vp-v{flex:1;}
  .vp-needs{margin:0;padding-left:16px;}
  .vp-ia{height:7px;background:#ddd2b8;border-radius:4px;overflow:hidden;margin-top:2px;}
  .vp-ia > i{display:block;height:100%;background:linear-gradient(90deg,#b5443a,#c8a24a,#3f7d54);}
  .vp-assess{margin-top:6px;padding:7px 9px;background:#f3ecdc;border-left:3px solid var(--accent);border-radius:0 5px 5px 0;color:var(--ink);}
  .tg{display:flex;align-items:center;gap:5px;font-size:12px;color:#5a4f42;margin-top:7px;cursor:pointer;user-select:none;}
  .tg input{margin:0;}
  .tg .sw{display:inline-block;width:18px;height:0;border-top:2px dashed var(--accent);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>辽东明清 · 沙盘 + 模拟器</h1>
    <span class="scene" id="sceneHint">载入中…</span>
    <span class="spacer"></span>
    <div class="mode-toggle" id="modeToggle">
      <button data-mode="real" class="active">史实</button>
      <button data-mode="sim">反事实</button>
      <button data-mode="diff">差异</button>
    </div>
  </header>
  <div class="body">
    <aside>
      <section class="block">
        <h2>年份</h2>
        <div class="c">
          <div class="yr-row"><input type="range" id="year" min="1616" max="1644" step="1" value="1616"><span class="yr-val" id="yrVal">1616</span></div>
          <div class="btn-row">
            <button class="btn" id="btnReset">复位</button>
            <button class="btn" id="btnStep">单步 ▶</button>
            <button class="btn primary" id="btnRun">运行 ▶▶</button>
            <button class="btn" id="btnPause">暂停</button>
            <button class="btn" id="btnReplay">重放史实</button>
          </div>
          <label class="tg"><input type="checkbox" id="tgArrows" checked> <span class="sw"></span>进军箭头（实控易手方向）</label>
        </div>
      </section>

      <section class="block">
        <h2>视角 / Viewpoint</h2>
        <div class="c">
          <select class="vp-sel" id="vpSel"></select>
          <div class="vp-card" id="vpCard"></div>
        </div>
      </section>

      <section class="block">
        <h2>反事实分支</h2>
        <div class="c"><div class="branches" id="branchBox"></div>
          <div class="hint">选分支后参数自动套用其 override；改参数即偏离该分支预设。</div>
        </div>
      </section>

      <section class="block">
        <h2>机制参数</h2>
        <div class="c" id="paramBox"></div>
      </section>

      <section class="block">
        <h2>吻合度 / 偏离</h2>
        <div class="c" id="stats"></div>
        <div class="c" style="padding-top:0"><ul class="divl" id="divl"></ul></div>
      </section>

      <section class="block">
        <h2>分支事件叙述</h2>
        <div class="c" id="be"></div>
      </section>
    </aside>

    <main>
      <div class="map-wrap" id="mapWrap">
        <canvas id="terrainCv"></canvas>
        <canvas id="ctrlCv"></canvas>
        <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="map-tools">
          <button data-zoom="in" title="放大">＋</button>
          <button data-zoom="out" title="缩小">－</button>
          <button data-zoom="fit" title="复位视图">⤢</button>
        </div>
        <div class="zoom-badge" id="zoomBadge">1.0×</div>
        <div class="scale-bar" id="scaleBar"></div>
        <div class="elev-legend" id="elBar"></div>
        <div class="map-hint" id="mapHint"></div>
      </div>
      <div class="legend" id="legend"></div>
    </main>
  </div>
</div>

<!-- 加载顺序：数据 → 引擎 → 地图内核 → 控制层 → 模拟态势层 -->
<script src="_sim_liaodong.js"></script>
<script src="sim_basemap.js"></script>
<script src="_faction_ming.js"></script>
<script src="sim_rules_liaodong.js"></script>
<script src="sim_ic_liaodong.js"></script>
<script src="sim_data_sarhu.js"></script>
<script src="sim_rules_sarhu.js"></script>
<script src="sim_ic_sarhu.js"></script>
<script src="control_layer.js"></script>
<script src="sim_engine.js"></script>
<script src="sim_mapcore.js"></script>
<script src="sim_layer.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var errBox = null;
  function fail(e){ var m=document.createElement('div'); m.className='err'; m.textContent='初始化失败：\n'+(e&&e.stack?e.stack:e); document.querySelector('.body').prepend(m); console.error(e); }

  try { init(); } catch(e){ fail(e); }

  function init(){
    var scene = SIM_CORE.sceneFromURL();
    var core = SIM_CORE.create(scene);
    var R = core.R, D = core.D, IC = core.IC;
    $('sceneHint').textContent = core.label + '（' + D.meta.startYear + '–' + D.meta.endYear + '）';

    var year0 = D.meta.startYear, year1 = D.meta.endYear;
    var state = { branch:'', mode:'real', year:year0, vp:'', vpSide:null };
    var terminalMatch = 0, running = false, runTimer = null;

    // ── 视角切换（v0.68）：同一战役，不同人（角色/派系/信息）决策与理解不同 ──
    var ROLE_TIER_LABEL = { cinC:'总指挥', column_cmd:'一路主将', enemy_cmd:'敌方统帅', ally_cmd:'盟军统帅', prince:'贝勒', sub_cmd:'裨将' };
    // side（数据真值：ming/jin/joseon）→ 党派名（partyColors 键：明方/清方；朝鲜无控色，仅叙事）
    var SIDE_PARTY = { ming:'明方', jin:'清方', joseon:'朝鲜' };
    // 视角党派翻转映射（唯一真值：明方/清方/朝鲜/contested）。史官视角（vpSide=null）不翻转。
    var VP_MAP = {
      ming:   { '明方':'我方', '清方':'敌方', '朝鲜':'友方', 'contested':'争夺中' },
      jin:    { '明方':'敌方', '清方':'我方', '朝鲜':'敌方', 'contested':'争夺中' },
      joseon: { '明方':'友方', '清方':'敌方', '朝鲜':'我方', 'contested':'争夺中' }
    };
    var VPS = (core.D.persons||[]).filter(function(p){ return p && p.perspective; });

    // ── 地图内核：地形 + 矢量底 + 交互 ──
    var mapWrap = $('mapWrap'), terrainCv = $('terrainCv'), ctrlCv = $('ctrlCv'), svg = $('map');
    var MC = SIM_MAPCORE.create({
      wrap: mapWrap, svg: svg, cv: terrainCv,
      seats: core.SEATS, basemap: window.SIM_BASEMAP,
      extraCanvases: function(){ return [ctrlCv]; },
      ids: { zoomBadge:'zoomBadge', scaleBar:'scaleBar', elBar:'elBar' },
      onDynamic: function(){ if (window.SimLayer && SimLayer.isReady()) SimLayer.repaint(); },
      // 萨尔浒战场仅 15 治所聚成一小簇，默认会因「自适应到治所 bbox」被放大到看不清区域上下文。
      // 传入固定辽东区域 bbox（与矢量底图 liaodong 视图一致 [119.5,38.5,129.0,44.5]），
      // 把战场放到全辽东尺度，边墙/河流/海岸线全部就位。默认 liaodong 场景不传 → 维持原行为。
      viewFit: 'liaodong',
      liaodongBBox: scene === 'sarhu' ? [119.5, 129.0, 38.5, 44.5] : null
    });
    MC.measure(); MC.initMap(); MC.loadTerrain(); MC.fitView(); MC.applyView(); MC.bindInteractions(); MC.paintElevLegend();

    // ── 控制层（沙盘）+ 模拟态势层（适配器）──
    var CL = window.ControlLayer;
    var Sim = window.SimLayer;
    Sim.setup({
      core: core, controlLayer: CL,
      cv: ctrlCv, px: MC.px, py: MC.py,
      getView: function(){ return MC.view; }, getCw: function(){ return MC.cw; }, getDpr: function(){ return window.devicePixelRatio || 1; }
    });

    drawSeats();
    loadCoast();

    // ── 进军箭头层（v0.69）：实控易手方向，从「获取方最近据点」派生，零逐帧重绘（随 viewBox 缩放）──
    var gArrows = document.createElementNS(MC.SVGNS,'g'); gArrows.setAttribute('id','gArrows'); $('map').appendChild(gArrows);
    function partyHex(p){ var c=core.D.partyColors && core.D.partyColors[p]; return c?('rgb('+c[0]+','+c[1]+','+c[2]+')'):'#888'; }
    function currentIntervals(){
      // diff 主图=史实（虚线），箭头随主图走史实；sim 模式走分支控制
      if(state.mode==='sim') return Sim.simIntervals(state.branch||'');
      return Sim.realIntervals();
    }
    function partyAt(iv, id, year){
      // 取覆盖该年、start 最大（最近生效）的区间，避免边界年重叠误判
      var best=null, bestStart=-1;
      for(var i=0;i<iv.length;i++){ var c=iv[i]; if(c.place_id===id && year>=c.start && year<=(c.end==null?1e9:c.end) && c.start>bestStart){ best=c.party; bestStart=c.start; } }
      return best;
    }
    function nearestSeatOfParty(target, party, partyMap){
      var best=null, bd=1e9;
      core.SEATS.forEach(function(s){
        if(s.id===target.id || partyMap[s.id]!==party) return;
        var d=(s.lon-target.lon)*(s.lon-target.lon)+(s.lat-target.lat)*(s.lat-target.lat);
        if(d<bd){ bd=d; best=s; }
      });
      return best;
    }
    function drawArrow(src, dst, party){
      var x1=MC.px(src.lon), y1=MC.py(src.lat), x2=MC.px(dst.lon), y2=MC.py(dst.lat);
      var col=partyHex(party);
      // halo：宽深色半透底线，保证在同色 voronoi 上仍可见
      var halo=document.createElementNS(MC.SVGNS,'line');
      halo.setAttribute('x1',x1); halo.setAttribute('y1',y1); halo.setAttribute('x2',x2); halo.setAttribute('y2',y2);
      halo.setAttribute('stroke','#2a2521'); halo.setAttribute('stroke-width',3.4); halo.setAttribute('opacity',0.35);
      halo.setAttribute('vector-effect','non-scaling-stroke');
      gArrows.appendChild(halo);
      // 有色虚线箭头（class=arr，供探针计数）
      var line=document.createElementNS(MC.SVGNS,'line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('class','arr');
      line.setAttribute('stroke',col); line.setAttribute('stroke-width',1.6); line.setAttribute('stroke-dasharray','4 3');
      line.setAttribute('vector-effect','non-scaling-stroke'); line.setAttribute('opacity',0.95);
      gArrows.appendChild(line);
      // 箭头三角：深色描边 + 党派色填充
      var ang=Math.atan2(y2-y1,x2-x1), L=7.5;
      var ax=x2-L*Math.cos(ang-Math.PI/7), ay=y2-L*Math.sin(ang-Math.PI/7);
      var bx=x2-L*Math.cos(ang+Math.PI/7), by=y2-L*Math.sin(ang+Math.PI/7);
      var tri=document.createElementNS(MC.SVGNS,'polygon');
      tri.setAttribute('points', x2+','+y2+' '+ax+','+ay+' '+bx+','+by);
      tri.setAttribute('fill',col); tri.setAttribute('stroke','#2a2521'); tri.setAttribute('stroke-width',0.6);
      tri.setAttribute('vector-effect','non-scaling-stroke');
      gArrows.appendChild(tri);
    }
    function renderAdvanceArrows(){
      while(gArrows.firstChild) gArrows.removeChild(gArrows.firstChild);
      var tg=$('tgArrows'); if(!tg || !tg.checked) return;
      var y=state.year; if(y<=year0) return;            // year0 无前一年可比 → 不画
      var iv=currentIntervals();
      var prev={}, cur={};
      core.SEATS.forEach(function(s){ prev[s.id]=partyAt(iv,s.id,y-1); cur[s.id]=partyAt(iv,s.id,y); });
      core.SEATS.forEach(function(s){
        var p0=prev[s.id], p1=cur[s.id];
        if(p1 && p1!==p0 && (p1==='明方'||p1==='清方')){   // 仅具体党派易手画方向箭头；contested 易手由控制色表达
          var src=nearestSeatOfParty(s, p1, prev); if(!src) return;
          drawArrow(src, s, p1);
        }
      });
    }
    if($('tgArrows')) $('tgArrows').addEventListener('change', renderAdvanceArrows);

    // ── 参数滑块 ──
    (function buildParams(){
      var box = $('paramBox'); box.innerHTML='';
      (R.params||[]).forEach(function(pr){
        var wrap=document.createElement('div'); wrap.className='param';
        wrap.innerHTML='<label>'+pr.label+'<span class="v" id="v_'+pr.id+'">'+(core.params[pr.id]!=null?core.params[pr.id]:pr.default).toFixed(2)+'</span></label>'+
          '<input type="range" id="p_'+pr.id+'" min="'+pr.min+'" max="'+pr.max+'" step="'+pr.step+'" value="'+(core.params[pr.id]!=null?core.params[pr.id]:pr.default)+'">';
        box.appendChild(wrap);
        var el=wrap.querySelector('input');
        el.addEventListener('input', function(){
          core.setParams((function(o){o[pr.id]=+el.value;return o;})({}));
          $('v_'+pr.id).textContent=(+el.value).toFixed(2);
          Sim.invalidate(); recomputeTerminal(); render();
        });
      });
    })();
    function syncParamLabels(){ (R.params||[]).forEach(function(pr){ var el=$('p_'+pr.id); if(el){ el.value=core.params[pr.id]; $('v_'+pr.id).textContent=(+core.params[pr.id]).toFixed(2);} }); }

    // ── 分支按钮 ──
    (function buildBranches(){
      var box=$('branchBox'); box.innerHTML='<button id="br_none" class="active">📜 史实重放</button>';
      (R.branches||[]).forEach(function(b){ var x=document.createElement('button'); x.id='br_'+b.id; x.textContent=b.label||b.id; box.appendChild(x); });
      $('br_none').addEventListener('click', function(){ selectBranch(''); });
      (R.branches||[]).forEach(function(b){ $('br_'+b.id).addEventListener('click', function(){ selectBranch(b.id); }); });
    })();
    function selectBranch(id){
      state.branch = id;
      ['br_none'].concat((R.branches||[]).map(function(b){return 'br_'+b.id;})).forEach(function(x){ var e=$(x); if(e) e.classList.toggle('active', x===('br_'+(id||'none'))); });
      if (id){ var b=core.getBranch(id); if(b&&b.override){ Object.keys(b.override).forEach(function(k){ core.params[k]=b.override[k]; }); } }
      else { core.resetParams(); }
      syncParamLabels(); Sim.invalidate(); recomputeTerminal(); render();
    }

    // ── 模式切换 ──
    $('modeToggle').querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.mode = btn.getAttribute('data-mode');
        $('modeToggle').querySelectorAll('button').forEach(function(x){ x.classList.toggle('active', x===btn); });
        Sim.setMode(state.mode); render();
      });
    });

    // ── 年份滑块 + 运行控制 ──
    var ySlider=$('year'); ySlider.min=year0; ySlider.max=year1; ySlider.value=year0;
    ySlider.addEventListener('input', function(){ state.year=+ySlider.value; render(); });
    $('btnReset').addEventListener('click', function(){ stopRun(); state.year=year0; ySlider.value=year0; render(); });
    $('btnStep').addEventListener('click', function(){ stopRun(); if(state.year<year1){ state.year++; ySlider.value=state.year; render(); } });
    $('btnRun').addEventListener('click', function(){ startRun(); });
    $('btnPause').addEventListener('click', function(){ stopRun(); });
    $('btnReplay').addEventListener('click', function(){ stopRun(); selectBranch(''); state.year=year0; ySlider.value=year0; render(); });

    function startRun(){
      if(running) return; running=true;
      if(state.year>=year1){ state.year=year0; ySlider.value=year0; }
      runTimer=setInterval(function(){
        state.year++; ySlider.value=state.year; render();
        if(state.year>=year1) stopRun();
      }, 130);
    }
    function stopRun(){ running=false; if(runTimer){ clearInterval(runTimer); runTimer=null; } }

    // ── 海岸线掩膜（真实边界裁剪控制色）──
    function loadCoast(){
      if(typeof fetch!=='function') return;
      fetch('../data/external/chgis/borders_1820.geojson').then(function(r){return r.json();}).then(function(gj){
        Sim.setCoast((gj.features||[]).map(function(f){ return { geom: f.geometry }; }));
      }).catch(function(e){ console.warn('[sim_map] 海岸线掩膜加载失败（file://?），退化为无裁剪 Voronoi：', e && e.message); });
    }

    // ── 治所标记（SVG，随 viewBox 自动缩放，无需逐帧重绘）──
    function drawSeats(){
      var L = MC.layers(); if(!L.gNodes) return;
      var key = core.beKeySeats ? core.beKeySeats() : [];
      core.SEATS.forEach(function(s){
        var x=MC.px(s.lon), y=MC.py(s.lat), isKey=key.indexOf(s.id)>=0;
        var c=document.createElementNS(MC.SVGNS,'circle');
        c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r', isKey?2.6:1.8);
        c.setAttribute('fill', isKey?'#2A2521':'#6b5f50'); c.setAttribute('stroke','#f3ecdc'); c.setAttribute('stroke-width',0.6);
        c.setAttribute('vector-effect','non-scaling-stroke'); L.gNodes.appendChild(c);
        if(isKey){
          var t=document.createElementNS(MC.SVGNS,'text');
          t.setAttribute('x',x+3.5); t.setAttribute('y',y+1.2); t.setAttribute('class','adm-label');
          t.setAttribute('font-size','7'); t.setAttribute('fill','#2A2521'); t.setAttribute('stroke','#f3ecdc'); t.setAttribute('stroke-width',0.5);
          t.textContent=s.name; L.gLabels.appendChild(t);
        }
      });
    }

    // ── 终局吻合度（分支/参数变化时重算一次）──
    function recomputeTerminal(){
      core.runTo(year1, state.branch||'');
      terminalMatch = core.matchCount();
    }

    // ── 主渲染 ──
    function render(){
      $('yrVal').textContent = state.year;
      Sim.setMode(state.mode);
      Sim.draw(state.year, 'region', state.branch||null);
      renderAdvanceArrows();
      updatePanel(state.year);
    }

    function realAt(year){
      var m={}; Sim.realIntervals().forEach(function(c){ if(year>=c.start && year<=(c.end==null?1e9:c.end)) m[c.place_id]=c.party; });
      return m;
    }
    function partyChip(p){
      var c=core.D.partyColors && core.D.partyColors[p]; c = c?('rgb('+c[0]+','+c[1]+','+c[2]+')'):'#888';
      var label = vpPartyLabel(p==null?'—':p);
      return '<span class="chip" style="background:'+c+'"></span>'+label;
    }

    function updatePanel(year){
      // 当前年状态
      core.runTo(year, state.branch||'');
      var simState = core.state;
      var real = realAt(year);
      var match=0, total=core.SEATS.length, divs=[];
      core.SEATS.forEach(function(s){
        var a=real[s.id], b=simState[s.id];
        if(a===b) match++; else divs.push({name:s.name, real:a, sim:b});
      });
      var pctCur = Math.round(match/total*100);
      var pctTerm = Math.round(terminalMatch/total*100);
      $('stats').innerHTML =
        '<div class="stat"><span>当前年吻合度（'+year+'）</span><span class="num">'+match+'/'+total+' ('+pctCur+'%)</span></div>'+
        '<div class="bar"><i style="width:'+pctCur+'%"></i></div>'+
        '<div class="stat"><span>终局吻合度（'+year1+'）</span><span class="num">'+terminalMatch+'/'+total+' ('+pctTerm+'%)</span></div>'+
        '<div class="bar"><i style="width:'+pctTerm+'%"></i></div>'+
        '<div class="stat"><span>本年偏离席位</span><span class="num">'+divs.length+'</span></div>'+
        '<div class="hint">终局吻合度=该分支推演到 '+year1+' 与史实终局一致席位；默认参数应为 100%（精确重放）。</div>';

      // 本年偏离列表
      var dl=$('divl'); dl.innerHTML='';
      if(!divs.length){ dl.innerHTML='<li style="color:var(--ink-soft)">与史实一致 ✓</li>'; }
      else divs.slice(0,40).forEach(function(d){
        var li=document.createElement('li');
        li.innerHTML = partyChip(d.real)+' <span class="arrow">→</span> '+partyChip(d.sim)+' <span style="margin-left:auto;color:var(--ink-soft)">'+d.name+'</span>';
        dl.appendChild(li);
      });

      // 分支事件
      renderBranchEvents();
    }

    function renderBranchEvents(){
      var el=$('be');
      if(!state.branch){ el.innerHTML='<div class="hint">史实重放：零分支事件。切换反事实分支后渲染。</div>'; return; }
      var events=core.computeBranchEvents();
      if(!events.length){ el.innerHTML='<div class="hint">本分支无偏离事件。</div>'; return; }
      var byYear={}; events.forEach(function(e){ (byYear[e.year]=byYear[e.year]||[]).push(e); });
      var sevlbl={info:'趋势',warn:'风险',bad:'危局'};
      var html='';
      Object.keys(byYear).sort(function(a,b){return +a-+b;}).forEach(function(y){
        byYear[y].forEach(function(e){
          html+='<div class="ev '+(e.severity||'info')+'"><span class="sev">'+(sevlbl[e.severity]||e.severity)+'</span><b>'+y+'</b> '+relabelText(core.beNarrative(e))+'</div>';
        });
      });
      el.innerHTML=html;
    }

    // ── 视角切换（v0.68）：选角 → 叙事按该 actor 的 understanding 重写 + 事件我方/敌方归属翻转 ──
    function vpPartyLabel(party){
      if(!state.vpSide) return party;
      var m = VP_MAP[state.vpSide]; return (m && m[party]) || party;
    }
    function relabelText(html){
      if(!state.vpSide) return html;
      return String(html).replace(/明方|清方|朝鲜/g, function(m){ return vpPartyLabel(m); });
    }
    function vpBadgeClass(side){
      if(!state.vpSide) return 'third';
      if(side===state.vpSide) return 'me';
      if((side==='joseon'&&state.vpSide==='ming')||(side==='ming'&&state.vpSide==='joseon')) return 'ally';
      return 'foe';
    }
    function buildViewpoint(){
      var sel=$('vpSel'); sel.innerHTML='';
      var o0=document.createElement('option'); o0.value=''; o0.textContent='📜 史官视角（中立）'; sel.appendChild(o0);
      if(!VPS.length){ sel.disabled=true; renderVPCard(); return; }
      [['ming','明方'],['jin','后金'],['joseon','朝鲜']].forEach(function(g){
        var ps=VPS.filter(function(p){return p.side===g[0];}); if(!ps.length) return;
        var og=document.createElement('optgroup'); og.label=g[1];
        ps.forEach(function(p){
          var o=document.createElement('option'); o.value=p.id;
          o.textContent=p.name+'（'+(ROLE_TIER_LABEL[p.perspective.role_tier]||p.perspective.role_tier)+'）';
          og.appendChild(o);
        });
        sel.appendChild(og);
      });
      sel.addEventListener('change', function(){ selectViewpoint(sel.value); });
      renderVPCard();
    }
    function selectViewpoint(id){
      state.vp = id || '';
      var p = id ? VPS.find(function(x){return x.id===id;}) : null;
      state.vpSide = p ? p.side : null;
      renderVPCard(); render();
    }
    function renderVPCard(){
      var el=$('vpCard');
      if(!VPS.length){ el.innerHTML='<div class="hint">本场景暂无多视角数据。</div>'; return; }
      if(!state.vp){ el.innerHTML='<div class="hint">选择一位参战者，以其视角重看此役——总指挥、一路主将、敌方统帅，所见与所求截然不同。</div>'; return; }
      var p=VPS.find(function(x){return x.id===state.vp;}); if(!p) return;
      var vp=p.perspective;
      var sideLabel=SIDE_PARTY[p.side]||p.side;
      var badgeText=vpPartyLabel(sideLabel);
      var ia=Math.round((vp.info_quality||0)*100);
      var needs=(vp.needs||[]).map(function(n){return '<li>'+n+'</li>';}).join('');
      el.innerHTML =
        '<div class="vp-head"><span class="vp-name">'+p.name+'</span>'+
        '<span class="vp-badge '+vpBadgeClass(p.side)+'">'+(ROLE_TIER_LABEL[vp.role_tier]||vp.role_tier)+'</span>'+
        '<span class="vp-badge '+vpBadgeClass(p.side)+'">'+badgeText+'</span></div>'+
        '<div class="vp-row"><span class="vp-k">目标</span><span class="vp-v">'+ (vp.objective||'—') +'</span></div>'+
        (needs?'<div class="vp-row"><span class="vp-k">需求</span><span class="vp-v"><ul class="vp-needs">'+needs+'</ul></span></div>':'')+
        '<div class="vp-row"><span class="vp-k">信息</span><span class="vp-v"><div class="vp-ia"><i style="width:'+ia+'%"></i></div><span class="hint" style="margin:0">质量 '+ia+'% · '+(vp.info_note||'')+'</span></span></div>'+
        '<div class="vp-row"><span class="vp-k">决策</span><span class="vp-v">'+(vp.decision_style||'—')+'</span></div>'+
        '<div class="vp-assess"><b>此役理解：</b>'+(vp.assessment||'—')+'</div>';
    }

    // 图例
    (function legend(){
      var box=$('legend');
      ['明方','清方','contested'].forEach(function(p){
        var c=core.D.partyColors && core.D.partyColors[p]; c=c?('rgb('+c[0]+','+c[1]+','+c[2]+')'):'#888';
        var it=document.createElement('div'); it.className='it';
        it.innerHTML='<span class="sw" style="background:'+c+'"></span>'+p;
        box.appendChild(it);
      });
      var h=document.createElement('div'); h.className='it'; h.style.marginLeft='auto'; h.style.color='var(--ink-soft)';
      h.textContent='地形：复旦 CHGIS DemTopo · 边界：CHGIS 1820 府级（时代差≈200年，诚实标注）';
      box.appendChild(h);
    })();

    // 首帧
    buildViewpoint();
    recomputeTerminal();
    Sim.setMode(state.mode);
    render();
    window.addEventListener('resize', function(){ MC.measure(); MC.applyView(); });
    // 布局稳定后再量一次（headless / 字体加载可能导致首帧量到 0 尺寸）
    if (window.ResizeObserver) { var ro = new ResizeObserver(function(){ MC.measure(); MC.applyView(); }); ro.observe(mapWrap); }
    window.addEventListener('load', function(){ MC.measure(); MC.applyView(); });
  }
})();
</script>
</body>
</html>
