<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>历史周期律 · 王朝兴衰模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{background:#161b22;padding:8px 12px;border-bottom:1px solid #30363d;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.top label{color:#8b949e;font-size:10px}
.top input[type=range]{width:90px;accent-color:#e94560}
.top .v{color:#e94560;font-weight:bold;font-size:10px;min-width:30px}
button{padding:4px 8px;border:none;border-radius:4px;cursor:pointer;font-size:11px;margin:1px}
.btn-run{background:#238636;color:#fff}.btn-pause{background:#6e40c9;color:#fff}
.btn-step{background:#1f6feb;color:#ccc}.btn-reset{background:#da3633;color:#fff}.btn-ff{background:#30363d;color:#ccc}
.btn-evt{background:#161b22;color:#8b949e;border:1px solid #30363d;font-size:10px}
.btn-evt:hover{background:#1f2428;border-color:#e94560}
canvas{border-bottom:1px solid #30363d}
.narr{background:#0d1117;padding:6px 12px;font-size:12px;border-bottom:1px solid #30363d}
.narr .d{color:#e94560}.narr .w{color:#d29922}.narr .g{color:#3fb950}.narr .m{color:#8b949e}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:#8b949e;padding:2px 12px}
.stats em{color:#e94560;font-style:normal}
</style></head>
<body>
<div class="top">
  <label>税率</label><input type="range" id="taxRate" min="5" max="60" value="30"><span class="v" id="vTax">30%</span>
  <label>军费</label><input type="range" id="milBudget" min="5" max="50" value="20"><span class="v" id="vMil">20%</span>
  <label>官僚</label><input type="range" id="burCost" min="5" max="40" value="15"><span class="v" id="vBur">15%</span>
  <button class="btn-run" onclick="run()">▶</button>
  <button class="btn-pause" onclick="pause()">⏸</button>
  <button class="btn-step" onclick="step()">⏭</button>
  <button class="btn-ff" onclick="ff()">+10</button>
  <button class="btn-ff" onclick="ff50()">+50</button>
  <button class="btn-reset" onclick="reset()">↺</button>
  <button class="btn-evt" onclick="evt('invasion')">入侵</button>
  <button class="btn-evt" onclick="evt('disaster')">天灾</button>
  <button class="btn-evt" onclick="evt('land_reform')">均田</button>
  <button class="btn-evt" onclick="evt('tax_cut')">减税</button>
</div>
<canvas id="cv"></canvas>
<div class="narr" id="narr"><span class="g">点击 ▶ 运行</span></div>
<div class="stats">
  第<em id="sDyn">1</em>王朝 · 享国<em id="sYear">0</em>年 ·
  兼并<em id="sLand">--</em> · 垄断<em id="sEdu">--</em> · 士绅分化<em id="sIneq">--</em> · 国库<em id="sTreas">--</em> ·
  军力<em id="sMil">--</em>/边患<em id="sBrd">--</em> · 叛军<em id="sReb">0</em>
</div>
<script>
"use strict";
var A=[],yr=0,paused=true,tm=null,events=[],dynNum=1,dynAge=0;
var landConc=0.2,eduMono=0.3,treasury=500,milPower=100,burEff=0.8,borderThreat=20,legitimacy=0.9,localIneq=0;
var CC={center:"#58a6ff",local:"#3fb950",grassroot:"#8b949e",rebel:"#e94560"};

function updSliders(){
  document.getElementById("vTax").textContent=document.getElementById("taxRate").value+"%";
  document.getElementById("vMil").textContent=document.getElementById("milBudget").value+"%";
  document.getElementById("vBur").textContent=document.getElementById("burCost").value+"%";
}
document.querySelectorAll("input[type=range]").forEach(function(el){el.oninput=updSliders;});

function reset(){
  pause();if(tm)clearTimeout(tm);
  A=[];yr=0;events=[];dynNum=1;dynAge=0;
  landConc=0.2;eduMono=0.3;treasury=500;milPower=100;burEff=0.8;borderThreat=20;legitimacy=0.9;localIneq=0;
  var N=60;
  for(var i=0,fid=0;i<N;i++){
    var cls,x,y,fam=null;
    if(i<N*0.08){cls="center";x=0.4+Math.random()*0.2;y=0.4+Math.random()*0.2;}
    else if(i<N*0.25){cls="local";x=0.2+Math.random()*0.6;y=0.2+Math.random()*0.6;if(Math.random()<0.5)fam="F"+(fid++%Math.max(1,Math.floor(N*0.05)));}
    else{cls="grassroot";x=Math.random();y=Math.random();}
    A.push({i:i,cls:cls,x:x,y:y,fam:fam,land:cls==="local"?5:cls==="center"?3:2,gr:cls==="center"?200:cls==="local"?120:60,tp:cls==="center"?100:cls==="local"?60:30,gv:0,alive:true,party:cls==="center"?"regime":"loyal"});
  }
  updSliders();paint();
}

function tick(){
  var tx=(+document.getElementById("taxRate").value)/100;
  var mb=(+document.getElementById("milBudget").value)/100;
  var bc=(+document.getElementById("burCost").value)/100;

  var locals=A.filter(function(a){return a.cls==="local"&&a.alive;});
  var grass=A.filter(function(a){return a.cls==="grassroot"&&a.alive;});
  locals.forEach(function(l){
    grass.forEach(function(g){if(d(g,l)<0.25&&g.land>0&&Math.random()<0.015){g.land-=0.5;l.land+=0.5;}});
  });

  var alive=A.filter(function(a){return a.alive;});
  var totalLand=alive.reduce(function(s,a){return s+a.land;},0)||1;
  landConc=locals.reduce(function(s,a){return s+a.land;},0)/totalLand;
  eduMono=Math.min(1,Math.max(0,eduMono+0.003+(landConc>0.5?0.003:0)-(burEff>0.7?0.002:0)));

  var tp=grass.length;
  var rev=Math.floor(Math.max(1,tp*(1-landConc*0.7))*10*tx*(1-landConc*0.5));
  treasury+=Math.floor(rev*(1-(0.8-burEff*0.5)));
  grass.forEach(function(g){var tax=Math.floor(Math.max(0,g.gr*tx*0.6));g.gr-=tax;if(g.gr<10)g.gv=Math.min(1,g.gv+0.03);g.gv=Math.min(1,g.gv+(tx-0.15)*0.03);});

  var mc=Math.floor(treasury*mb),buc=Math.floor(treasury*bc);
  treasury-=mc+buc;
  milPower+=mc>0?mc*0.1:-milPower*0.05;milPower=Math.max(0,milPower);
  burEff=Math.max(0.1,burEff-0.001+(bc>0.15?0.002:0));
  if(treasury<0){burEff-=0.005;treasury=Math.max(0,treasury);}

  borderThreat+=1.5+landConc*2;
  if(milPower>borderThreat*0.8)borderThreat=Math.max(10,borderThreat-3);

  legitimacy=Math.max(0.1,1-eduMono*0.7-landConc*0.2-(treasury<50?0.02:0)-(burEff<0.3?0.01:0));

  var ctl=Math.max(0,1-landConc*(0.8-burEff*0.5)-eduMono*0.3+(legitimacy-0.5)*0.4);

  events.filter(function(e){return e.year===yr;}).forEach(function(e){
    if(e.t==="invasion"){borderThreat+=40;alive.forEach(function(a){if(a.cls!=="center")a.gv=Math.min(1,a.gv+0.1);});}
    if(e.t==="disaster"){alive.forEach(function(a){a.gr=Math.max(0,Math.floor(a.gr*0.7));a.gv=Math.min(1,a.gv+0.2);});}
    if(e.t==="land_reform"){landConc=Math.max(0,landConc-0.15);locals.forEach(function(l){l.land=Math.max(1,l.land*0.7);l.gv=Math.min(1,l.gv+0.3);});grass.forEach(function(g){g.land+=1;});}
    if(e.t==="tax_cut"){var el=document.getElementById("taxRate");el.value=Math.max(5,+el.value-10);updSliders();grass.forEach(function(g){g.gv=Math.max(0,g.gv-0.15);});}
  });

  alive.forEach(function(a){a.gr+=(a.cls==="center"?8:a.cls==="local"?6:4);a.tp+=(a.cls==="center"?1:0.3);});

  // 士绅内部竞争
  var famPow={},famAgents={};
  locals.forEach(function(l){if(!l.fam)l.fam="F_independent";if(!famPow[l.fam]){famPow[l.fam]=0;famAgents[l.fam]=[];}famPow[l.fam]+=l.land+l.tp*0.1;famAgents[l.fam].push(l);});
  var fEntries=Object.keys(famPow).map(function(k){return [k,famPow[k]];}).sort(function(a,b){return b[1]-a[1];});
  var totalLocalPow=fEntries.reduce(function(s,e){return s+e[1];},0)||1;
  var domRatio=fEntries.length?fEntries[0][1]/totalLocalPow:0;
  var weakestPow=fEntries.length>1?fEntries[fEntries.length-1][1]:fEntries[0]?fEntries[0][1]:0;
  localIneq=totalLocalPow>0?(fEntries[0][1]-weakestPow)/totalLocalPow:0;

  fEntries.forEach(function(e,idx){
    var share=e[1]/totalLocalPow;
    if(idx>fEntries.length*0.6){famAgents[e[0]].forEach(function(l){l.gv=Math.min(1,l.gv+(0.3-share)*0.04);l._marginal=true;});}
  });
  if(fEntries.length>=2&&domRatio>0.5&&Math.random()<0.2){
    var wf=fEntries[fEntries.length-1][0];
    famAgents[fEntries[0][0]].forEach(function(l){if(Math.random()<0.3){l.land+=0.5;l.gv=Math.max(0,l.gv-0.05);}});
    famAgents[wf].forEach(function(l){l.land=Math.max(1,l.land-0.5);l.gv=Math.min(1,l.gv+0.08);});
  }
  if(domRatio>0.5&&ctl<0.25&&Math.random()<0.1){
    var coupLeaders=famAgents[fEntries[0][0]].slice(0,2);
    coupLeaders.forEach(function(l){l.cls="center";l.party="regime";l.tp+=50;l.gr+=100;l.gv=0;});
    A.filter(function(a){return a.cls==="center"&&a.alive&&coupLeaders.indexOf(a)<0;}).forEach(function(a){a.cls="local";a.party="loyal";a.gv=0.4;});
  }

  // 士绅叛逃（边缘家族门槛更低）
  locals.forEach(function(l){
    if(l.party!=="loyal")return;
    var th=l._marginal?0.35:0.5;
    var cth=l._marginal?0.35:0.3;
    if(l.gv>th||(ctl<cth&&l.gv>0.2))l.party="rebel";
  });

  var ga=grass.reduce(function(s,a){return s+a.gv;},0)/Math.max(1,grass.length);
  if(ga>0.55||(ctl<0.2&&ga>0.35)){
    var loyalGrass=grass.filter(function(a){return a.party==="loyal";});
    var nRev=Math.ceil(loyalGrass.length*0.3);
    for(var i=0;i<Math.min(nRev,loyalGrass.length);i++){if(Math.random()<0.5+ga*0.5)loyalGrass[i].party="rebel";}
  }

  var rebels=A.filter(function(a){return a.party==="rebel"&&a.alive;});
  if(rebels.length>=3&&ctl<0.4){
    A.filter(function(a){return a.cls==="center"&&a.alive;}).forEach(function(c){
      var nr=rebels.filter(function(r){return d(r,c)<0.25;}).length;
      if(nr>=3){c.tp-=15;c.gr-=20;if(c.tp<=0){c.alive=false;c.party="dead";}}
    });
    rebels.forEach(function(r){
      A.filter(function(n){return n.party==="loyal"&&n.alive&&d(n,r)<0.2&&Math.random()<0.3;}).forEach(function(n){n.party="rebel";});
    });
  }

  var ac=A.filter(function(a){return a.cls==="center"&&a.alive;}).length;
  var ar=rebels.filter(function(r){return r.alive;}).length;
  var ta=A.filter(function(a){return a.alive;}).length;
  if(ac===0||(ar>ta*0.4&&ar>=5)||(milPower<borderThreat*0.3&&ar>=3)){
    dynNum++;dynAge=0;landConc=0.15;eduMono=0.25;treasury=400;milPower=80;burEff=0.75;borderThreat=15;legitimacy=0.85;
    var newRulers=rebels.filter(function(r){return r.alive;}).sort(function(a,b){return b.tp-a.tp;}).slice(0,Math.ceil(ta*0.06));
    newRulers.forEach(function(a){a.cls="center";a.party="regime";a.tp=120;a.gr=250;a.gv=0;});
    A.filter(function(a){return a.cls==="center"&&a.alive;}).forEach(function(a){if(newRulers.indexOf(a)<0){a.cls="grassroot";a.party="loyal";a.gv=0.3;}});
    rebels.forEach(function(a){a.party="loyal";a.gv=Math.max(0,a.gv-0.4);});
    A.filter(function(a){return a.cls==="local"&&a.alive&&Math.random()<0.3;}).forEach(function(a){a.cls="grassroot";a.land=1;});
  }

  var rc=rebels.filter(function(r){return r.alive;}).length;
  yr++;dynAge++;
  updateUI(ctl,ga,rc);
}

function updateUI(ctl,ga,rc){
  document.getElementById("sDyn").textContent=dynNum;
  document.getElementById("sYear").textContent=dynAge;
  document.getElementById("sLand").textContent=(landConc*100).toFixed(0)+"%";
  document.getElementById("sEdu").textContent=(eduMono*100).toFixed(0)+"%";
  document.getElementById("sIneq").textContent=(localIneq*100).toFixed(0)+"%";
  document.getElementById("sTreas").textContent=Math.floor(treasury);
  document.getElementById("sMil").textContent=Math.floor(milPower);
  document.getElementById("sBrd").textContent=Math.floor(borderThreat);
  document.getElementById("sReb").textContent=rc;
  var el=document.getElementById("narr"),t="";
  if(rc>=6)t='<span class="d">💀 崩溃：'+rc+'叛军</span>';
  else if(rc>=2)t='<span class="w">⚠ '+rc+'叛军，控制力'+ctl.toFixed(2)+'</span>';
  else if(landConc>0.5)t='<span class="w">📊 土地兼并'+landConc.toFixed(2)+'</span>';
  else t='<span class="g">✓ 稳定 兼并'+landConc.toFixed(2)+' 垄断'+eduMono.toFixed(2)+'</span>';
  el.innerHTML=t+'<span class="m"> · 第'+dynNum+'王朝 '+dynAge+'年</span>';
}

function d(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}

var cv,ctx;
function setupCv(){cv=document.getElementById("cv");cv.width=cv.parentElement.clientWidth;cv.height=Math.min(window.innerHeight-170,440);ctx=cv.getContext("2d");}
function paint(){if(!ctx)return;var w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#21262d";ctx.lineWidth=0.5;
  for(var i=0;i<10;i++){ctx.beginPath();ctx.moveTo(i*w/10,0);ctx.lineTo(i*w/10,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*h/10);ctx.lineTo(w,i*h/10);ctx.stroke();}
  var fm={};A.filter(function(a){return a.alive&&a.fam;}).forEach(function(a){if(!fm[a.fam])fm[a.fam]=[];fm[a.fam].push(a);});
  Object.keys(fm).forEach(function(k){var m=fm[k];if(m.length<2)return;ctx.strokeStyle="rgba(63,185,80,0.12)";ctx.lineWidth=1;ctx.beginPath();m.forEach(function(a,i){var px=a.x*w,py=a.y*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});ctx.stroke();});
  A.filter(function(a){return a.alive;}).forEach(function(a){var px=a.x*w,py=a.y*h,color=a.party==="rebel"?CC.rebel:a.cls==="center"?CC.center:a.cls==="grassroot"?CC.grassroot:(a._marginal?"#1a6b2a":CC.local),r=a.cls==="center"?7:a.cls==="local"?5:4;ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=0.5;ctx.stroke();});
}

function run(){paused=false;loop();}
function pause(){paused=true;}
function step(){tick();paint();}
function ff(){for(var i=0;i<10;i++)tick();paint();}
function ff50(){for(var i=0;i<50;i++)tick();paint();}
function loop(){if(paused)return;tick();paint();tm=setTimeout(loop,200);}
function evt(t){events.push({year:yr+1,t:t});if(paused)step();}

window.onload=function(){setupCv();reset();paint();};
window.onresize=function(){setupCv();paint();};
</script>
</body>
</html>
