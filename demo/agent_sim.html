<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>历史周期律 · 王朝兴衰模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 system-ui,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;height:100vh;overflow:hidden}
.sidebar{width:300px;background:#161b22;padding:12px;overflow-y:auto;flex-shrink:0;border-right:1px solid #30363d}
.sidebar h2{font-size:15px;color:#e94560;margin-bottom:8px;border-bottom:1px solid #30363d;padding-bottom:6px}
.sidebar h3{font-size:11px;color:#8b949e;margin:10px 0 4px;text-transform:uppercase;letter-spacing:1px}
.section{margin-bottom:8px}
.section label{display:flex;justify-content:space-between;font-size:11px;color:#8b949e;margin-bottom:2px}
.section label .v{color:#e94560;font-weight:bold}
.section input[type=range]{width:100%;accent-color:#e94560}
.section .hint{font-size:10px;color:#484f58;margin-top:1px}
button{padding:5px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px;margin:2px}
.btn-run{background:#238636;color:#fff}
.btn-pause{background:#6e40c9;color:#fff}
.btn-step{background:#1f6feb;color:#ccc}
.btn-ff{background:#30363d;color:#ccc}
.btn-reset{background:#da3633;color:#fff}
.btn-evt{background:#161b22;color:#8b949e;border:1px solid #30363d;display:block;width:100%;text-align:left;margin:2px 0;padding:4px 8px;font-size:10px;border-radius:3px}
.btn-evt:hover{background:#1f2428;color:#c9d1d9;border-color:#e94560}
.btn-evt .k{color:#e94560;margin-left:6px;font-size:9px}
.btn-ok{background:#238636;color:#fff;width:100%;margin-top:4px}
.ctrl-row{display:flex;gap:4px;margin:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px}
.legend span{font-size:10px;color:#8b949e}
.stats{font-size:10px}
.stats .row{display:flex;justify-content:space-between;padding:1px 0;border-bottom:1px solid #21262d}
.stats .row .lv{color:#e94560}
.main{flex:1;display:flex;flex-direction:column}
#cv{cursor:crosshair;border-bottom:1px solid #30363d}
#chartCv{height:150px;background:#0d1117;border-top:1px solid #30363d}
.narr{height:50px;padding:6px 12px;font-size:11px;background:#0d1117;border-bottom:1px solid #30363d;overflow:hidden}
.narr .w{color:#d29922}.narr .d{color:#e94560}.narr .g{color:#3fb950}.narr .m{color:#8b949e}
.tt{position:absolute;display:none;background:#161b22;border:1px solid #e94560;padding:5px 8px;font-size:10px;border-radius:4px;pointer-events:none;z-index:100}
.tt b{color:#fff}.tt s{color:#8b949e}
.log{display:none;max-height:120px;overflow-y:auto;padding:4px 8px;font-size:10px;background:#0d1117;border-top:1px solid #30363d}
.log .r{color:#e94560}.log .y{color:#d29922}.log .b{color:#58a6ff}.log .m{color:#8b949e}
</style>
</head>
<body>
<div class="sidebar">
  <h2>🏛 历史周期律模拟</h2>
  <div class="legend">
    <span><i style="background:#58a6ff"></i>朝廷</span>
    <span><i style="background:#3fb950"></i>士绅</span>
    <span><i style="background:#8b949e"></i>庶民</span>
    <span><i style="background:#e94560"></i>叛军</span>
  </div>
  <div style="font-size:10px;color:#484f58;margin-bottom:6px;line-height:1.4">
    <b>核心机制</b>：土地兼并→税基萎缩→财政危机→军队废弛→外敌入侵→王朝覆灭。<br>
    绿线=士绅家族联姻。单击地图看详情。<br>
    所有参数<span style="color:#e94560">实时生效</span>，无需重置。
  </div>

  <h3>⚙ 经济参数</h3>
  <div class="section">
    <label>税率<span class="v" id="vTax">30%</span></label>
    <input type="range" id="taxRate" min="5" max="60" value="30">
    <div class="hint">↑国库收入 ↑庶民负担</div>
  </div>
  <div class="section">
    <label>军费占比<span class="v" id="vMil">20%</span></label>
    <input type="range" id="milBudget" min="5" max="50" value="20">
    <div class="hint">↑军队战力 ↑国库消耗</div>
  </div>
  <div class="section">
    <label>官僚开支<span class="v" id="vBur">15%</span></label>
    <input type="range" id="burCost" min="5" max="40" value="15">
    <div class="hint">↑行政效率 ↑财政负担</div>
  </div>

  <h3>⚡ 事件与改革</h3>
  <button class="btn-evt" onclick="triggerEvent('invasion')">⚔ 外敌入侵<span class="k">边境威胁+40，急需军费</span></button>
  <button class="btn-evt" onclick="triggerEvent('disaster')">🌪 天灾（旱/涝/蝗）<span class="k">全国粮食-30%，不满+0.2</span></button>
  <button class="btn-evt" onclick="triggerEvent('land_reform')">📜 均田令<span class="k">土地兼并-0.15，士绅不满+0.3</span></button>
  <button class="btn-evt" onclick="triggerEvent('tax_cut')">💰 减税<span class="k">税率-10%，庶民不满-0.15</span></button>
  <button class="btn-evt" onclick="triggerEvent('purge')">🗑 肃贪<span class="k">官僚效率+0.1，士绅不满+0.1</span></button>
  <button class="btn-evt" onclick="triggerEvent('conscript')">🏹 征兵<span class="k">朝廷兵力+30%，庶民劳力-5%</span></button>

  <h3>⏱ 控制</h3>
  <div class="ctrl-row">
    <button class="btn-run" onclick="run()">▶ 运行</button>
    <button class="btn-pause" onclick="pause()">⏸</button>
    <button class="btn-step" onclick="tick()">⏭</button>
    <button class="btn-ff" onclick="ff()">⏩+10</button>
    <button class="btn-ff" onclick="ff50()">⏩+50</button>
    <button class="btn-reset" onclick="reset()">↺</button>
  </div>
  <div class="section">
    <label>速度<span class="v" id="vSpd">200ms</span></label>
    <input type="range" id="speed" min="20" max="500" value="200" style="direction:rtl">
  </div>

  <h3>📊 国势</h3>
  <div class="stats">
    <div class="row"><span>王朝</span><span class="lv" id="sDyn">第1王朝</span></div>
    <div class="row"><span>年份 / 享国</span><span class="lv" id="sYear">0</span></div>
    <div class="row"><span>土地兼并度</span><span class="lv" id="sLand">--</span></div>
    <div class="row"><span>国库（粮）</span><span class="lv" id="sTreas">--</span></div>
    <div class="row"><span>军力 / 边患</span><span class="lv" id="sMil">--</span></div>
    <div class="row"><span>官僚效率</span><span class="lv" id="sEff">--</span></div>
    <div class="row"><span>朝廷(白)/士绅(绿)/庶民(灰)</span><span class="lv" id="sPop">--</span></div>
    <div class="row"><span>叛军</span><span class="lv" id="sReb">0</span></div>
    <div class="row"><span>庶民不满</span><span class="lv" id="sGrv">--</span></div>
  </div>
  <div style="font-size:10px;color:#484f58;margin-top:6px;cursor:pointer" onclick="tgLog()">📋 事件日志 ▼</div>
  <div class="log" id="lg"></div>
</div>

<div class="main">
  <canvas id="cv"></canvas>
  <div class="narr" id="narr"><span class="m">点击 ▶ 运行开始。调整左侧滑块即时生效，无需重置。</span></div>
  <canvas id="chartCv"></canvas>
</div>
<div class="tt" id="tt"></div>

<script>
// ============================================================
// 历史周期律 · 土地兼并 → 财政危机 → 军力衰败 → 王朝覆灭
// ============================================================
let A=[], yr=0, paused=true, tm=null, hist=[], events=[];
let dynNum=1, dynAge=0, landConc=0.2, treasury=500, milPower=100, burEff=0.8, borderThreat=20;
const CC={center:'#58a6ff',local:'#3fb950',grassroot:'#8b949e',rebel:'#e94560'};
const CN={center:'朝廷',local:'士绅',grassroot:'庶民',rebel:'叛军'};

function P(k,def){
  let el=document.getElementById(k);
  return el? +el.value : def;
}

function createAgent(i,cls,x,y,fam){
  return {i,cls,x,y,fam,land:cls==='local'?5:cls==='center'?3:2, gr:cls==='center'?200:cls==='local'?120:60, tp:cls==='center'?100:cls==='local'?60:30, gv:0, alive:true, party:cls==='center'?'regime':'loyal'};
}

function reset(){
  pause(); if(tm)clearTimeout(tm);
  A=[]; yr=0; hist=[]; events=[]; dynNum=1; dynAge=0;
  landConc=0.2; treasury=500; milPower=100; burEff=0.8; borderThreat=20;
  let N=60;
  for(let i=0,fid=0;i<N;i++){
    let cls,x,y,fam=null;
    if(i<N*0.08){cls='center';x=0.4+Math.random()*0.2;y=0.4+Math.random()*0.2;}
    else if(i<N*0.25){cls='local';x=0.2+Math.random()*0.6;y=0.2+Math.random()*0.6;if(Math.random()<0.5)fam='F'+(fid++%Math.max(1,Math.floor(N*0.05)));}
    else{cls='grassroot';x=Math.random();y=Math.random();}
    A.push(createAgent(i,cls,x,y,fam));
  }
  updateSliders(); render();
  lg('🚩 第'+dynNum+'王朝建立。均田地、轻徭役、简官僚。','m');
}

// ===== CORE CYCLE =====
function tick(){
  let tx=P('taxRate',30)/100, mb=P('milBudget',20)/100, bc=P('burCost',15)/100;

  // 1. 土地兼并（核心引擎）
  A.filter(a=>a.cls==='local'&&a.alive).forEach(l=>{
    A.filter(a=>a.cls==='grassroot'&&a.alive&&dist(a,l)<0.25&&a.land>0).forEach(g=>{
      if(Math.random()<0.015){g.land-=0.5; l.land+=0.5;}
    });
  });
  // 士绅土地越多，兼并越快
  landConc=A.filter(a=>a.alive&&a.cls==='local').reduce((s,a)=>s+a.land,0)/
           Math.max(1,A.filter(a=>a.alive).reduce((s,a)=>s+a.land,0));

  // 2. 税收
  let taxpayers=A.filter(a=>a.cls==='grassroot'&&a.alive).length;
  let tBase=Math.max(1,taxpayers*(1-landConc*0.7)); // 土地兼并→税基萎缩
  let tRevenue=Math.floor(tBase*10*tx*(1-landConc*0.5));
  // 税收先入国库，但腐败截留一部分
  treasury+=Math.floor(tRevenue*(1-(0.8-burEff*0.5)));
  // 税负转移到庶民
  A.filter(a=>a.cls==='grassroot'&&a.alive).forEach(g=>{
    let tax=Math.floor(Math.max(0, g.gr*tx*0.6));
    g.gr-=tax;
    if(g.gr<10)g.gv=Math.min(1,g.gv+0.03);
    g.gv=Math.min(1,g.gv+(tx-0.15)*0.03); // 高税率积累不满
  });

  // 3. 财政支出
  let milCost=Math.floor(treasury*mb);
  let burCost=Math.floor(treasury*bc);
  treasury-=milCost+burCost;
  milPower+=milCost>0?milCost*0.1: -milPower*0.05; // 没钱=军队溃散
  milPower=Math.max(0,milPower);

  // 4. 官僚效率自然衰减（除非持续投入）
  burEff=Math.max(0.1, burEff-0.001 + (bc>0.15?0.002:0));
  if(treasury<0){burEff-=0.005; treasury=Math.max(0,treasury);} // 财政崩溃

  // 5. 边患积累
  borderThreat+=1.5+landConc*2; // 土地兼并越严重，边患越猖獗
  if(milPower>borderThreat*0.8)borderThreat=Math.max(10,borderThreat-3);

  // 6. 中央对地方控制力
  let controlPower=Math.max(0,1-landConc*1.2-(0.8-burEff)*0.5);

  // 7. 事件
  let yes=events.filter(e=>e.year===yr);
  yes.forEach(e=>{
    if(e.t==='invasion'){borderThreat+=40; lg('⚔ 外敌入侵！边患+40','b');
      A.filter(a=>a.alive).forEach(a=>{if(a.cls!=='center')a.gv=Math.min(1,a.gv+0.1);});}
    if(e.t==='disaster'){A.filter(a=>a.alive).forEach(a=>{a.gr=Math.max(0,Math.floor(a.gr*0.7));a.gv=Math.min(1,a.gv+0.2);});lg('🌪 天灾！全国粮食-30%，不满飙升','y');}
    if(e.t==='land_reform'){landConc=Math.max(0,landConc-0.15);
      A.filter(a=>a.cls==='local'&&a.alive).forEach(l=>{l.land=Math.max(1,l.land*0.7);l.gv=Math.min(1,l.gv+0.3);});
      A.filter(a=>a.cls==='grassroot'&&a.alive).forEach(g=>g.land+=1); lg('📜 均田令！兼并-0.15，士绅震怒','y');}
    if(e.t==='tax_cut'){
      let el=document.getElementById('taxRate'); el.value=Math.max(5,+el.value-10); updateSliders();
      A.filter(a=>a.cls==='grassroot'&&a.alive).forEach(g=>g.gv=Math.max(0,g.gv-0.15));
      lg('💰 减税10%！庶民不满-0.15','g');}
    if(e.t==='purge'){burEff=Math.min(1,burEff+0.1);
      A.filter(a=>a.cls==='local'&&a.alive).forEach(l=>l.gv=Math.min(1,l.gv+0.1));
      lg('🗑 肃贪！官僚效率+0.1','g');}
    if(e.t==='conscript'){A.filter(a=>a.cls==='center'&&a.alive).forEach(c=>c.tp+=30);
      A.filter(a=>a.cls==='grassroot'&&a.alive).forEach(g=>g.gr=Math.max(0,Math.floor(g.gr*0.95)));
      lg('🏹 征兵！朝廷兵力+30，庶民劳力-5%','b');}
  });

  // 8. 自然增长
  A.filter(a=>a.alive).forEach(a=>{
    a.gr+=(a.cls==='center'?8:a.cls==='local'?6:4);
    a.tp+=(a.cls==='center'?1:0.3);
  });

  // 9. 士绅投机（控制力弱→叛逃）
  let ctl=controlPower;
  A.filter(a=>a.cls==='local'&&a.alive&&a.party==='loyal').forEach(l=>{
    if(l.gv>0.5||(ctl<0.3&&l.gv>0.3)){l.party='rebel';lg('🔀 士绅叛逃（不满='+l.gv.toFixed(2)+'）','y');}
  });

  // 10. 庶民造反
  let grv_avg=A.filter(a=>a.cls==='grassroot'&&a.alive).reduce((s,a)=>s+a.gv,0)/
              Math.max(1,A.filter(a=>a.cls==='grassroot'&&a.alive).length);
  if(grv_avg>0.55||(ctl<0.2&&grv_avg>0.35)){
    let gg=A.filter(a=>a.cls==='grassroot'&&a.alive&&a.party==='loyal');
    let nRevolt=Math.ceil(gg.length*0.3);
    for(let i=0;i<Math.min(nRevolt,gg.length);i++){
      if(Math.random()<0.5+grv_avg*0.5){gg[i].party='rebel';}
    }
    if(nRevolt>2)lg('🔥 农民起义！'+nRevolt+'庶民揭竿（不满='+grv_avg.toFixed(2)+' 控制力='+ctl.toFixed(2)+'）','r');
  }

  // 11. 叛乱扩散
  let rebels=A.filter(a=>a.party==='rebel'&&a.alive);
  if(rebels.length>=3&&ctl<0.4){
    // 围城
    A.filter(a=>a.cls==='center'&&a.alive).forEach(c=>{
      let nr=rebels.filter(r=>dist(r,c)<0.25).length;
      if(nr>=3){c.tp-=15;c.gr-=20;if(c.tp<=0){c.alive=false;c.party='dead';lg('💀 京城陷落！朝廷覆灭','r');}}
    });
    // 蔓延
    rebels.forEach(r=>{
      A.filter(n=>n.party==='loyal'&&n.alive&&dist(n,r)<0.2&&Math.random()<0.3).forEach(n=>n.party='rebel');
    });
  }

  // 12. 王朝颠覆
  let aliveC=A.filter(a=>a.cls==='center'&&a.alive).length;
  let aliveR=rebels.filter(r=>r.alive).length;
  let totalAlive=A.filter(a=>a.alive).length;
  if(aliveC===0||(aliveR>totalAlive*0.4&&aliveR>=5)||(milPower<borderThreat*0.3&&aliveR>=3)){
    lg('👑 第'+dynNum+'王朝覆灭！享国'+dynAge+'年。土地兼并='+landConc.toFixed(2)+' 边患='+Math.floor(borderThreat),'r');
    // 新朝建立
    dynNum++; dynAge=0; landConc=0.15; treasury=400; milPower=80; burEff=0.75; borderThreat=15;
    // 叛军中的强者成为新朝廷
    let newRulers=rebels.filter(r=>r.alive).sort((a,b)=>b.tp-a.tp).slice(0,Math.ceil(totalAlive*0.06));
    newRulers.forEach(a=>{a.cls='center';a.party='regime';a.tp=120;a.gr=250;a.gv=0;});
    // 旧朝廷全部降级
    A.filter(a=>a.cls==='center'&&a.alive).forEach(a=>{if(!newRulers.includes(a)){a.cls='grassroot';a.party='loyal';a.gv=0.3;}});
    A.filter(a=>a.party==='rebel').forEach(a=>{a.party='loyal';a.gv=Math.max(0,a.gv-0.4);});
    // 旧士绅部分降级
    A.filter(a=>a.cls==='local'&&a.alive&&Math.random()<0.3).forEach(a=>{a.cls='grassroot';a.land=1;});
    lg('🚩 第'+dynNum+'王朝建立！均田轻徭，万象更新。','g');
  }

  // 记录
  let rCount=rebels.filter(r=>r.alive).length;
  hist.push({yr,dyn:yr-dynAge,landConc,treasury,milPower,borderThreat,burEff,grv_avg,rCount,dynNum,dynAge});
  yr++; dynAge++;
  updateNarr(controlPower,grv_avg,rCount);
  updateStats();
}

function updateNarr(ctl,grv,r){
  let el=document.getElementById('narr'),t='';
  if(r>=8)t='<span class="d">💀 帝国崩溃中：'+r+'叛军横行，朝廷名存实亡。</span>';
  else if(r>=3)t='<span class="w">⚠ 叛乱四起：'+r+'叛军。中央控制力='+ctl.toFixed(2)+'。边境告急。</span>';
  else if(ctl<0.3)t='<span class="w">⚡ 控制力崩塌：'+ctl.toFixed(2)+'。土地兼并='+landConc.toFixed(2)+'，税基枯竭。</span>';
  else if(landConc>0.6)t='<span class="w">📊 土地兼并严重='+landConc.toFixed(2)+'。自耕农大量破产。</span>';
  else if(treasury<100)t='<span class="w">💰 财政告急：国库仅'+Math.floor(treasury)+'粮。军费不足。</span>';
  else t='<span class="g">✓ 国泰民安。兼并='+landConc.toFixed(2)+' 国库='+Math.floor(treasury)+' 军力='+Math.floor(milPower)+'</span>';
  el.innerHTML=t+' <span class="m">· 第'+dynNum+'王朝 第'+dynAge+'年</span>';
}

function updateStats(){
  document.getElementById('sDyn').textContent='第'+dynNum+'王朝';
  document.getElementById('sYear').textContent=yr+' / 享国'+dynAge;
  document.getElementById('sLand').textContent=(landConc*100).toFixed(0)+'%';
  document.getElementById('sTreas').textContent=Math.floor(treasury);
  document.getElementById('sMil').textContent=Math.floor(milPower)+' / '+Math.floor(borderThreat);
  document.getElementById('sEff').textContent=burEff.toFixed(2);
  let cc=A.filter(a=>a.cls==='center'&&a.alive).length, lc=A.filter(a=>a.cls==='local'&&a.alive).length, gc=A.filter(a=>a.cls==='grassroot'&&a.alive).length;
  document.getElementById('sPop').textContent=cc+' / '+lc+' / '+gc;
  document.getElementById('sReb').textContent=A.filter(a=>a.party==='rebel'&&a.alive).length;
  let ga=A.filter(a=>a.cls==='grassroot'&&a.alive).reduce((s,a)=>s+a.gv,0)/Math.max(1,gc);
  document.getElementById('sGrv').textContent=ga.toFixed(2);
}

function updateSliders(){
  document.getElementById('vTax').textContent=document.getElementById('taxRate').value+'%';
  document.getElementById('vMil').textContent=document.getElementById('milBudget').value+'%';
  document.getElementById('vBur').textContent=document.getElementById('burCost').value+'%';
  document.getElementById('vSpd').textContent=document.getElementById('speed').value+'ms';
}

// ===== RENDER =====
let cv,ctx,chCv,chCtx;
function setupCv(){
  cv=document.getElementById('cv');cv.width=cv.parentElement.clientWidth;cv.height=Math.min(window.innerHeight-300,440);
  ctx=cv.getContext('2d');
  chCv=document.getElementById('chartCv');chCv.width=cv.width;chCv.height=150;chCtx=chCv.getContext('2d');}
function render(){if(!ctx)return;let w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#21262d';ctx.lineWidth=0.5;for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(i*w/10,0);ctx.lineTo(i*w/10,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*h/10);ctx.lineTo(w,i*h/10);ctx.stroke();}
  let fm={};A.filter(a=>a.alive&&a.fam).forEach(a=>{if(!fm[a.fam])fm[a.fam]=[];fm[a.fam].push(a);});
  Object.values(fm).forEach(m=>{if(m.length<2)return;ctx.strokeStyle='rgba(63,185,80,0.12)';ctx.lineWidth=1;ctx.beginPath();m.forEach((a,i)=>{let px=a.x*w,py=a.y*h;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});ctx.stroke();});
  A.filter(a=>a.alive).forEach(a=>{let px=a.x*w,py=a.y*h,color=a.party==='rebel'?CC.rebel:CC[a.cls],r=a.cls==='center'?7:a.cls==='local'?5:4;ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=0.5;ctx.stroke();});
  renderChart();
}
function renderChart(){if(!chCtx||hist.length<2)return;let cw=chCv.width,ch=chCv.height;chCtx.clearRect(0,0,cw,ch);
  let N=hist.length,step=Math.max(1,Math.floor(N/cw));
  let maxV=Math.max(1,...hist.map(h=>h.landConc),...hist.map(h=>h.borderThreat/100));
  [{g:h=>h.landConc,c:'#d29922',l:'兼并'},{g:h=>h.borderThreat/100,c:'#e94560',l:'边患'},{g:h=>(h.rCount||0)/Math.max(1,A.filter(a=>a.alive).length),c:'#8b949e',l:'叛乱%'}].forEach(ln=>{
    chCtx.strokeStyle=ln.c;chCtx.lineWidth=2;chCtx.beginPath();
    for(let i=0;i<N;i+=step){let x=(i/N)*cw,y=ch-(ln.g(hist[i])/maxV)*ch;i===0?chCtx.moveTo(x,y):chCtx.lineTo(x,y);}chCtx.stroke();});
  chCtx.fillStyle='#8b949e';chCtx.font='10px monospace';
  chCtx.fillText('黄=土地兼并  红=边患  灰=叛乱比例',5,12);
  // Dynasty markers
  for(let i=1;i<hist.length;i++){if(hist[i].dynNum!==hist[i-1].dynNum){let x=(i/N)*cw;chCtx.strokeStyle='rgba(88,166,255,0.5)';chCtx.lineWidth=1;chCtx.beginPath();chCtx.moveTo(x,0);chCtx.lineTo(x,ch);chCtx.stroke();chCtx.fillStyle='#58a6ff';chCtx.fillText('第'+hist[i].dynNum+'王朝',x+2,ch-4);}}
}

// ===== UI =====
function run(){paused=false;loop();}
function pause(){paused=true;}
function ff(){for(let i=0;i<10&&!paused;i++)tick();render();}
function ff50(){for(let i=0;i<50&&!paused;i++)tick();render();}
function loop(){if(paused)return;tick();render();let spd=+document.getElementById('speed').value||200;tm=setTimeout(loop,spd);}
function triggerEvent(t){events.push({year:yr+1,t});lg('📌 排入: Y'+(yr+1)+' '+t,'m');if(paused){tick();render();}}
function lg(msg,c){let el=document.getElementById('lg');el.innerHTML+='<div class='+c+'>[Y'+yr+'] '+msg+'</div>';el.scrollTop=el.scrollHeight;}
function tgLog(){let el=document.getElementById('lg');el.style.display=el.style.display==='block'?'none':'block';}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// Slider oninput
['taxRate','milBudget','burCost'].forEach(id=>{
  let el=document.getElementById(id);
  if(el)el.oninput=el.onchange=updateSliders;
});
document.getElementById('speed').oninput=document.getElementById('speed').onchange=function(){document.getElementById('vSpd').textContent=this.value+'ms';};

// Click tooltip
document.getElementById('cv').onclick=function(e){
  let rect=cv.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,found=null,md=15;
  A.filter(a=>a.alive).forEach(a=>{let d=Math.hypot(a.x*cv.width-mx,a.y*cv.height-my);if(d<md){found=a;md=d;}});
  let tt=document.getElementById('tt');
  if(found){tt.style.display='block';tt.style.left=(e.clientX-rect.left+15)+'px';tt.style.top=(e.clientY-rect.top-10)+'px';
    tt.innerHTML='<b>'+CN[found.cls]+' #'+found.i+'</b> <s>('+CN[found.party==='rebel'?'rebel':found.cls]+')</s><br>土地:'+found.land.toFixed(1)+' 粮食:'+found.gr+' 兵力:'+found.tp+'<br>不满:'+found.gv.toFixed(2);}else{tt.style.display='none';}
};

window.onload=function(){setupCv();reset();render();};
window.onresize=function(){setupCv();render();};
</script>
