<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>史实锚定模拟器 · 明末辽东实控演变</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;height:100vh;overflow:hidden}
.sidebar{width:min(340px,30vw);background:#161b22;padding:10px;overflow-y:auto;flex-shrink:0;border-right:1px solid #30363d;font-size:clamp(12px,1.2vw,14px)}
.sidebar h2{font-size:clamp(14px,1.5vw,18px);color:#58a6ff;margin-bottom:6px;border-bottom:1px solid #30363d;padding-bottom:6px}
.sidebar h3{font-size:clamp(11px,1.1vw,13px);color:#8b949e;margin:10px 0 4px;cursor:pointer;user-select:none}
.legend{display:flex;gap:8px;margin:4px 0;flex-wrap:wrap}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:3px}
.legend span{font-size:clamp(10px,1vw,12px);color:#8b949e}
.section label{display:flex;justify-content:space-between;font-size:clamp(10px,1vw,12px);color:#8b949e;margin:4px 0 1px}
.section input[type=range]{width:100%;accent-color:#58a6ff}
.ctrl-row{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
button{padding:4px 8px;border:none;border-radius:4px;cursor:pointer;font-size:clamp(10px,1vw,12px);margin:1px}
.btn-run{background:#238636;color:#fff}.btn-pause{background:#6e40c9;color:#fff}.btn-step{background:#1f6feb;color:#ccc}
.btn-reset{background:#da3633;color:#fff}.btn-mode{background:#1f2428;color:#8b949e;border:1px solid #30363d}
.btn-mode:hover{background:#58a6ff;color:#fff}
.stats{font-size:clamp(10px,1vw,12px)}
.stats .row{display:flex;justify-content:space-between;padding:1px 0;border-bottom:1px solid #21262d}
.stats .row .lv{color:#58a6ff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
#cv{flex:1;cursor:crosshair;border-bottom:1px solid #30363d;min-height:0}
.narr{height:clamp(36px,6vh,50px);padding:4px 12px;font-size:clamp(11px,1.1vw,14px);background:#0d1117;border-bottom:1px solid #30363d;display:flex;align-items:center}
.narr .w{color:#d29922}.narr .g{color:#3fb950}.narr .m{color:#8b949e}.narr .d{color:#e94560}
.pf{font-size:clamp(10px,1vw,12px);margin:2px 0}
.pf b{color:#c9d1d9}.pf .f{color:#8b949e;font-size:10px}
.divl{font-size:clamp(9px,0.9vw,11px);color:#e94560;max-height:120px;overflow-y:auto}
.hint{font-size:clamp(9px,0.9vw,11px);color:#484f58;line-height:1.4}
.tt{position:absolute;display:none;background:#161b22;border:1px solid #58a6ff;padding:5px 8px;font-size:clamp(10px,1vw,12px);border-radius:4px;pointer-events:none;z-index:100}
.tt b{color:#fff}.tt s{color:#8b949e}
</style>
</head>
<body>
<div class="sidebar">
  <h2>🧭 史实锚定模拟器</h2>
  <div class="hint">世界 = 真实史料数据（<code>data/control_liaodong.json</code> 的 36 治所 + 1616–1644 逐年控制权）。机制只决定每条史实征服在给定参数下是否"成功施加"——默认精确重放史实，调参即反事实。</div>
  <div class="legend" id="legend"></div>

  <h3>⏱ 时间</h3>
  <div class="section">
    <label>年份<span class="v" id="vYear">1616</span></label>
    <input type="range" id="year" min="1616" max="1644" value="1616" step="1">
  </div>
  <div class="ctrl-row">
    <button class="btn-run" id="btnRun">▶ 运行</button>
    <button class="btn-pause" id="btnPause">⏸</button>
    <button class="btn-step" id="btnStep">⏭</button>
    <button class="btn-reset" id="btnReset">↺ 复位</button>
  </div>
  <div class="ctrl-row">
    <button class="btn-mode" id="btnReplay">📜 重放史实(默认)</button>
    <button class="btn-mode" id="btnWhatif">🎲 随机反事实</button>
  </div>

  <h3>⚙ 机制参数（调参=反事实）</h3>
  <div class="section">
    <label>清方执行力<span class="v" id="vQing">1.00</span></label>
    <input type="range" id="effQing" min="0.3" max="1" step="0.05" value="1">
  </div>
  <div class="section">
    <label>明方执行力<span class="v" id="vMing">1.00</span></label>
    <input type="range" id="effMing" min="0.3" max="1" step="0.05" value="1">
  </div>
  <div class="section">
    <label>扩散偏好(邻占才易取)<span class="v" id="vSpread">1.00</span></label>
    <input type="range" id="spread" min="0" max="1" step="0.05" value="1">
  </div>

  <h3>📊 国势 / 吻合度</h3>
  <div class="stats" id="stats"></div>

  <h3>🔀 推演偏离史实</h3>
  <div class="divl" id="divl"><span class="m">（默认重放：零偏离）</span></div>

  <h3>🎭 真实历史 actors（派系，维度#3）</h3>
  <div id="pf"></div>
</div>

<div class="main">
  <canvas id="cv"></canvas>
  <div class="narr" id="narr"><span class="m">点击 ▶ 运行，或拖动年份滑块。地图坐标 = 真实治所经纬度投影。</span></div>
</div>
<div class="tt" id="tt"></div>

<script src="_sim_liaodong.js"></script>
<script>
// ============================================================
// 史实锚定模拟器：世界=真实数据，机制=史实征服的"是否成功施加"
// ============================================================
const D = window.SIM_DATA;
if(!D){document.getElementById('narr').innerHTML='<span class="d">✗ 未加载 SIM_DATA（_sim_liaodong.js）</span>';}
const PARTY = D.partyColors;
const SEATS = D.seats;
const seatById = {}; SEATS.forEach(s=>seatById[s.id]=s);
const COSMID = Math.cos(44*Math.PI/180);

function hex(c){return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}
function neighbors(id){
  const a=seatById[id]; if(!a)return [];
  return SEATS.filter(b=>b.id!==id && Math.hypot((a.lon-b.lon)*COSMID, a.lat-b.lat)<1.6).map(b=>b.id);
}

// ---- 状态机 ----
let state = {};            // place_id -> 当前控制方
let year = D.meta.startYear;
let divergences = [];       // 未成功的史实转移（推演≠史实）
let running=false, timer=null;

function resetSim(){
  state = Object.assign({}, D.startControl);
  year = D.meta.startYear;
  divergences = [];
}
function effFor(party){
  if(party==='清方') return +document.getElementById('effQing').value;
  if(party==='明方') return +document.getElementById('effMing').value;
  return 1.0; // contested(弃守) 必然发生
}
function applyYear(Y){
  const ts = D.transitions.filter(t=>t.year===Y);
  const spread = +document.getElementById('spread').value;
  for(const t of ts){
    let eff = effFor(t.to);
    let success = (eff>=1.0) ? true : (Math.random()<eff);
    if(success && spread<1.0 && t.to!=='contested'){
      const hasN = neighbors(t.place_id).some(nid=>state[nid]===t.to);
      if(!hasN) success = (Math.random()<spread);
    }
    if(success) state[t.place_id]=t.to;
    else divergences.push({year:Y, place:t.place_id, to:t.to, name:seatById[t.place_id]?seatById[t.place_id].name:''});
  }
}
function runTo(Y){
  // 从起始重算到 Y（幂等：每次从头 apply 逐年）
  resetSim();
  for(let y=D.meta.startYear+1; y<=Y; y++) applyYear(y);
  year = Y;
}

// ---- 渲染 ----
let cv,ctx;
function setupCv(){cv=document.getElementById('cv');cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight;ctx=cv.getContext('2d');}
function render(){
  if(!ctx)return;
  const w=cv.width,h=cv.height,pad=30;
  ctx.clearRect(0,0,w,h);
  // 坐标范围（x 已按 cos 压缩）
  let xs=SEATS.map(s=>s.x), ys=SEATS.map(s=>s.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const sx=(w-2*pad)/(xmax-xmin||1), sy=(h-2*pad)/(ymax-ymin||1);
  const sc=Math.min(sx,sy);
  const X=s=>pad+(s.x-xmin)*sc, Yc=s=>pad+(s.y-ymin)*sc;
  // 邻接线
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  SEATS.forEach(s=>neighbors(s.id).forEach(nid=>{const b=seatById[nid];ctx.beginPath();ctx.moveTo(X(s),Yc(s));ctx.lineTo(X(b),Yc(b));ctx.stroke();}));
  // 治所点
  SEATS.forEach(s=>{
    const p=state[s.id]||'?'; const col=PARTY[p]?hex(PARTY[p]):'#555';
    const r=6; ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(s),Yc(s),r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=0.5;ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='9px system-ui';ctx.fillText(s.name, X(s)+8, Yc(s)+3);
  });
  drawLegend();
}
function drawLegend(){
  const el=document.getElementById('legend'); el.innerHTML='';
  Object.keys(PARTY).forEach(p=>{
    el.innerHTML+='<span><i style="background:'+hex(PARTY[p])+'"></i>'+p+'</span>';
  });
}
function updateStats(){
  const ys=Object.values(state);
  const cnt={}; ys.forEach(p=>cnt[p]=(cnt[p]||0)+1);
  const total=SEATS.length;
  let match=0; SEATS.forEach(s=>{if((state[s.id]||'')===(D.terminalReal[s.id]||''))match++;});
  const pct=(match/total*100).toFixed(0);
  let html='';
  Object.keys(PARTY).forEach(p=>{html+='<div class="row"><span>'+p+'</span><span class="lv">'+(cnt[p]||0)+'</span></div>';});
  html+='<div class="row"><span>推演年</span><span class="lv">'+year+'</span></div>';
  html+='<div class="row"><span>史实吻合度</span><span class="lv" style="color:'+(pct==='100'?'#3fb950':'#d29922')+'">'+pct+'%</span></div>';
  document.getElementById('stats').innerHTML=html;
  // 偏离列表
  const dl=document.getElementById('divl');
  if(divergences.length===0) dl.innerHTML='<span class="m">（零偏离：推演==史实）</span>';
  else dl.innerHTML=divergences.map(d=>'· '+d.year+' '+d.name+' 归'+d.to+' 未达成').join('<br>');
}
function updateNarr(){
  const el=document.getElementById('narr');
  const pct=Math.round(SEATS.filter(s=>(state[s.id]||'')===(D.terminalReal[s.id]||'')).length/SEATS.length*100);
  if(pct===100) el.innerHTML='<span class="g">✓ 精确重放史实（'+year+'年）。调低"执行力/扩散偏好"即可产生反事实偏离。</span>';
  else el.innerHTML='<span class="w">⚠ 反事实推演（'+year+'年），史实吻合度 '+pct+'%。'+divergences.length+' 处征服未在参数下达成。</span>';
}
function paint(){render();updateStats();updateNarr();document.getElementById('vYear').textContent=year;document.getElementById('year').value=year;}

// ---- 控制 ----
function step(){ if(year<D.meta.endYear){year++; applyYear(year); paint();} else {pause();} }
function run(){ if(running)return; running=true; timer=setInterval(()=>{ if(year>=D.meta.endYear){pause();return;} step(); }, 350); document.getElementById('btnRun').textContent='▶ 运行中'; }
function pause(){ running=false; if(timer)clearInterval(timer); timer=null; document.getElementById('btnRun').textContent='▶ 运行'; }
function resetAll(){ pause(); resetSim(); paint(); }

document.getElementById('btnRun').onclick=run;
document.getElementById('btnPause').onclick=pause;
document.getElementById('btnStep').onclick=()=>{pause();step();};
document.getElementById('btnReset').onclick=resetAll;
document.getElementById('btnReplay').onclick=()=>{
  document.getElementById('effQing').value=1;document.getElementById('effMing').value=1;document.getElementById('spread').value=1;
  syncParamLabels(); resetAll();
};
document.getElementById('btnWhatif').onclick=()=>{
  document.getElementById('effQing').value=0.55;document.getElementById('effMing').value=0.9;document.getElementById('spread').value=0.7;
  syncParamLabels(); resetAll();
};
document.getElementById('year').oninput=function(){ pause(); year=+this.value; runTo(year); paint(); };
['effQing','effMing','spread'].forEach(id=>{document.getElementById(id).oninput=function(){syncParamLabels();};});
function syncParamLabels(){
  document.getElementById('vQing').textContent=(+document.getElementById('effQing').value).toFixed(2);
  document.getElementById('vMing').textContent=(+document.getElementById('effMing').value).toFixed(2);
  document.getElementById('vSpread').textContent=(+document.getElementById('spread').value).toFixed(2);
}

// 真实人物（派系面板）
function renderPersons(){
  const el=document.getElementById('pf'); const by={};
  D.persons.forEach(p=>{const f=p.faction||'unknown';(by[f]=by[f]||[]).push(p);});
  el.innerHTML=Object.keys(by).map(f=>'<div class="pf"><b>'+f+'</b> <span class="f">('+by[f].length+')</span><br>'+
    by[f].map(p=>'· '+(p.name||p.id)+(p.role?' <span class="f">'+p.role+'</span>':'')).join('<br>')+'</div>').join('');
}

// 悬浮提示
document.getElementById('cv').onmousemove=function(e){
  if(!ctx)return;
  const rect=cv.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const w=cv.width,h=cv.height,pad=30;
  let xs=SEATS.map(s=>s.x),ys=SEATS.map(s=>s.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  const sc=Math.min((w-2*pad)/(xmax-xmin||1),(h-2*pad)/(ymax-ymin||1));
  const X=s=>pad+(s.x-xmin)*sc, Yc=s=>pad+(s.y-ymin)*sc;
  let found=null,md=12;
  SEATS.forEach(s=>{const d=Math.hypot(X(s)-mx,Yc(s)-my);if(d<md){found=s;md=d;}});
  const tt=document.getElementById('tt');
  if(found){tt.style.display='block';tt.style.left=(e.clientX-rect.left+12)+'px';tt.style.top=(e.clientY-rect.top-10)+'px';
    tt.innerHTML='<b>'+found.name+'</b> <s>('+found.lon+','+found.lat+')</s><br>控制方: '+(state[found.id]||'?')+'<br>史实1644: '+(D.terminalReal[found.id]||'?');}
  else tt.style.display='none';
};

window.onload=function(){setupCv();syncParamLabels();resetSim();renderPersons();paint();};
window.onresize=function(){setupCv();paint();};
</script>
</body>
</html>
